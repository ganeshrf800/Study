<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study</title>
<meta name="description" content="Interactive study lessons.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="STD12/style.css">
</head><body>
<div class="top"><a class="brand" href="./">Study</a><span class="sp"></span><button class="btn" id="theme">Theme</button></div>
<div class="app"><main>
<div class="cover"><h1>Study</h1><p>Interactive lessons with live simulations, formulae, real-world examples and quick checks.</p></div>
<div class="cards" style="--sub:var(--physics)">
<a class="card" href="STD12/"><small>Class 12 / CBSE and NCERT</small><b>STD12</b><span style="color:var(--muted);font-size:.9rem">Physics, Chemistry, Mathematics and Biology. 63 topics.</span></a>
</div>
</main></div>
<script>
(function(){var r=document.documentElement;try{var t=localStorage.getItem('tb-theme');if(t)r.dataset.theme=t}catch(e){}
document.getElementById('theme').addEventListener('click',function(){var d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('tb-theme',r.dataset.theme)}catch(e){}})})();
</script>
</body></html>
