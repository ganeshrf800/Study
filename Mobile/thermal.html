const PAGE={
file:"thermal.html",title:"Thermal Study",kicker:"Study · heat, skin temperature and throttling",
lede:"A phone has no fan. Every watt the SoC, radios, display and charger dissipate must spread through the board and frame and leave through the glass and metal surfaces by natural convection and radiation. That limits sustained power to roughly 4–6 W, and it is why performance drops after a few minutes of gaming.",
stats:[["Heat path","Junction → spreader → surface → air"],["Surface h","≈ 10–12 W/m²K"],["Skin target","≈ 43–45 °C"],["Junction limit","≈ 95–105 °C"],["Body time constant","≈ 10–15 min"]],
sections:[

html:`<div class="calc"><div class="cin">
<fieldset><legend>Heat sources (W)</legend>
<label>SoC<input type="number" id="tSoc" value="5" step="0.5" min="0"></label>

</div></div>`},
{id:"theory",title:"How phones shed heat",toc:"Method",
html:`<div class="theory"><div><h3>Heat paths</h3><p>Heat leaves the SoC die through the package and a thermal interface material into a spreader: graphite sheets (in-plane conductivity around 1,000–1,500 W/mK) or a vapor chamber, which moves heat by evaporating and condensing a fluid and behaves like a very high-conductivity plate. The spreader carries heat to the frame and glass, which lose it to the air by natural convection (about 5–7 W/m²K) and radiation (about 5–6 W/m²K).</p><p>With a total surface of roughly 0.025 m² and h ≈ 11 W/m²K, the whole phone has a surface-to-air resistance near 3.5–4 K/W. A 20 K rise over a 25 °C room is therefore only about 5 W, the practical sustained budget.</p></div>
<div><h3>Limits and throttling</h3><p>Two limits matter. The junction must stay under roughly 95–105 °C for reliability and leakage control. The skin, the part a user touches, is usually held to about 43–45 °C, in line with the touch-temperature guidance in IEC 62368-1 for surfaces held for long periods. Charging also slows when the battery passes about 40–45 °C.</p><p>Because the phone body has a thermal time constant of 10–15 minutes, short bursts at 8–10 W are fine; sustained loads are throttled once the body warms. Better spreading delays throttling by lowering the hotspot, but cannot raise the total power the surfaces can shed.</p></div></div>`}
],

const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function net(){

 const sp=SPR[$("tSpr").value],A=2*W*L,Rsa=1/(h*A),P=soc+rf+dsp+chg+oth;
 const Tavg=amb+P*Rsa,Thot=amb+P*Rsa*(1+sp[1]),Tspr=Thot+soc*sp[0],Tj=Tspr+soc*(rjc+rtim);
 const pSkin=(43-amb)/(Rsa*(1+sp[1])),pJ=soc>0?(95-amb-(P-soc)*Rsa*(1+sp[1]))/(Rsa*(1+sp[1])+sp[0]+rjc+rtim):0;
 $("tOut").innerHTML=`<div><span class="label">Total heat</span><b>${P.toFixed(1)} W</b></div><div><span class="label">Surface-to-air R</span><b>${Rsa.toFixed(2)} K/W</b></div><div><span class="label">Average skin</span><b class="${Tavg>43?"bad":"ok"}">${Tavg.toFixed(1)} °C</b></div><div><span class="label">Hotspot skin</span><b class="${Thot>43?"bad":"ok"}">${Thot.toFixed(1)} °C</b></div><div><span class="label">Junction</span><b class="${Tj>95?"bad":"ok"}">${Tj.toFixed(1)} °C</b></div><div><span class="label">Max total power for 43 °C skin</span><b>${pSkin.toFixed(1)} W</b></div>`;
 $("tNote").textContent=`Hotspot factor for ${sp[3].toLowerCase()} is ${(sp[1]*100).toFixed(0)}% above the average surface rise. Junction would reach 95 °C at about ${Math.max(0,pJ).toFixed(1)} W of SoC power with the other loads unchanged.`;
 // network drawing
 const nodes=[["Junction",Tj],["Package top",Tj-soc*rjc],["Spreader",Tspr],["Skin hotspot",Thot],["Ambient",amb]];
 const res=[["R_jc",rjc,soc],["R_TIM",rtim,soc],["Spreading",sp[0],soc],["Surface → air",Rsa*(1+sp[1]),P]];
 let s="";const x0=60,dx=195,y=110,col=t=>t>95?"var(--copper)":t>43?"var(--pwr)":"var(--ok)";

// ---------- transient ----------
function sim(){
 const amb=g("tAmb"),h=g("tH"),W=g("tW")/1000,L=g("tL")/1000,sp=SPR[$("tSpr").value],Rsa=1/(h*2*W*L)*(1+sp[1]);
 const Rjb=g("tRjc")+g("tRtim")+sp[0],Cj=3,Cb=g("gMass")*g("gCp"),req=g("gReq"),oth=g("gOth"),dur=g("gMin")*60,skin=g("gSkin"),tjl=g("gTj");
 let Tj=amb,Tb=amb,p=req,pi=req;const dt=0.5,out=[];let tFirst=null;
 for(let t=0;t<=dur;t+=dt){
  // governor: PI control on the tighter of the two limits (Kp = 3 W/K, Ki = 0.01 W/K·s, clamped integrator)
  const e=Math.min(tjl-Tj,skin-Tb);
  if(e<0&&tFirst===null)tFirst=t;
  if(tFirst!==null){pi=Math.max(0.5,Math.min(req,pi+0.01*e*dt));p=Math.max(0.5,Math.min(req,pi+3*e))}else p=req;
  const q=(Tj-Tb)/Rjb;Tj+=dt*(p-q)/Cj;Tb+=dt*(q+oth-(Tb-amb)/Rsa)/Cb;
  if(Math.round(t*2)%20===0)out.push([t,Tj,Tb,p]);
 }
 const last=out[out.length-1],avgLast=out.filter(o=>o[0]>dur-300).reduce((a,o)=>a+o[3],0)/Math.max(1,out.filter(o=>o[0]>dur-300).length);
 $("gOut").innerHTML=`<div><span class="label">Throttling starts</span><b>${tFirst===null?"never":(tFirst/60).toFixed(1)+" min"}</b></div><div><span class="label">Sustained SoC power</span><b>${avgLast.toFixed(1)} W</b></div><div><span class="label">Sustained clock / performance</span><b class="${Math.cbrt(avgLast/req)<0.8?"bad":"ok"}">≈ ${(100*Math.cbrt(avgLast/req)).toFixed(0)}%</b></div><div><span class="label">Sustained power ratio</span><b>${(100*avgLast/req).toFixed(0)}%</b></div><div><span class="label">Final junction</span><b>${last[1].toFixed(1)} °C</b></div><div><span class="label">Final skin hotspot</span><b>${last[2].toFixed(1)} °C</b></div><div><span class="label">Body time constant</span><b>${(Rsa*Cb/60).toFixed(1)} min</b></div>`;
 const Lx=60,R=880,T=14,B=220,X=t=>Lx+t/dur*(R-Lx),tmin=Math.floor(amb/10)*10,tmax=Math.max(110,Math.ceil((Math.max(...out.map(o=>o[1]))+5)/10)*10),Y=v=>B-(v-tmin)/(tmax-tmin)*(B-T);
 let s="";for(let v=tmin;v<=tmax;v+=10){s+=`<line x1="${Lx}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${Lx-6}" y="${Y(v)+3}" text-anchor="end">${v} °C</text>`}
 const step=dur>3600?10:5;for(let m=0;m<=dur/60;m+=step){s+=`<text x="${X(m*60)}" y="${B+14}" text-anchor="middle">${m} min</text>`}
 s+=`<line x1="${Lx}" x2="${R}" y1="${Y(tjl)}" y2="${Y(tjl)}" stroke="var(--copper)" stroke-dasharray="5 3"/><line x1="${Lx}" x2="${R}" y1="${Y(skin)}" y2="${Y(skin)}" stroke="var(--lo)" stroke-dasharray="5 3"/>`;
 s+=`<polyline fill="none" stroke="var(--copper)" stroke-width="2.4" points="${out.map(o=>`${X(o[0])},${Y(o[1])}`).join(" ")}"/><polyline fill="none" stroke="var(--lo)" stroke-width="2.4" points="${out.map(o=>`${X(o[0])},${Y(o[2])}`).join(" ")}"/>`;
 s+=`<rect x="${R-230}" y="${T+4}" width="222" height="40" fill="var(--surface)" stroke="var(--line)"/><line x1="${R-222}" x2="${R-200}" y1="${T+16}" y2="${T+16}" stroke="var(--copper)" stroke-width="2.4"/><text x="${R-194}" y="${T+19}">Junction (limit dashed)</text><line x1="${R-222}" x2="${R-200}" y1="${T+32}" y2="${T+32}" stroke="var(--lo)" stroke-width="2.4"/><text x="${R-194}" y="${T+35}">Skin hotspot (limit dashed)</text>`;
 $("gT").innerHTML=s;
 const B2=170,Y2=v=>B2-v/Math.max(req,1)*(B2-T);let s2=`<line x1="${Lx}" x2="${R}" y1="${Y2(req)}" y2="${Y2(req)}" stroke="var(--line)" stroke-dasharray="4 3"/><text x="${Lx-6}" y="${Y2(req)+3}" text-anchor="end">${req} W</text><text x="${Lx-6}" y="${Y2(0)+3}" text-anchor="end">0</text><line x1="${Lx}" x2="${R}" y1="${Y2(0)}" y2="${Y2(0)}" stroke="var(--line)"/>`;
 s2+=`<path d="M${X(0)} ${Y2(0)} ${out.map(o=>`L${X(o[0])} ${Y2(o[3])}`).join(" ")} L${X(dur)} ${Y2(0)} Z" fill="color-mix(in oklab,var(--ok) 25%,transparent)" stroke="var(--ok)" stroke-width="2"/>`;
 for(let m=0;m<=dur/60;m+=step){s2+=`<text x="${X(m*60)}" y="${B2+14}" text-anchor="middle">${m} min</text>`}
 s2+=`<text x="${Lx+6}" y="${T+10}">Delivered SoC power (requested ${req} W)</text>`;
 $("gP").innerHTML=s2;

let spr="gr";const hs=$("hSpr");Object.entries(SPR).forEach(([k,v])=>{const b=document.createElement("button");b.className="btn2";b.textContent=v[3];b.setAttribute("aria-pressed",String(k===spr));b.onclick=()=>{spr=k;[...hs.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));heat()};hs.appendChild(b)});
function heat(){
 const NX=38,NY=81,amb=g("tAmb"),h=g("tH"),W=g("tW")/1000,L=g("tL")/1000,cell=(W/NX)*(L/NY),gc=h*cell*2,Gs=SPR[spr][2];
 const q=new Float64Array(NX*NY),T=new Float64Array(NX*NY).fill(amb);
 const put=(fx,fy,w,hh,P)=>{const x0=Math.round(fx*NX-w/2),y0=Math.round(fy*NY-hh/2),n=w*hh;for(let y=y0;y<y0+hh;y++)for(let x=x0;x<x0+w;x++)q[y*NX+x]+=P/n};
 put(0.5,0.27,4,4,g("hSoc"));put(0.3,0.86,3,3,g("hPa")*0.6);put(0.72,0.12,3,3,g("hPa")*0.4);put(0.5,0.55,14,14,g("hChg"));
 const pd=g("hDisp")/(NX*NY);for(let i=0;i<q.length;i++)q[i]+=pd;
 // Solve (Gs·Laplacian + gc·I)·θ = q for the rise θ = T − T_amb with conjugate gradient (system is symmetric positive definite)
 const n=NX*NY,A=v=>{const o=new Float64Array(n);for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){const i=y*NX+x;let s=gc*v[i];
   if(x>0)s+=Gs*(v[i]-v[i-1]);if(x<NX-1)s+=Gs*(v[i]-v[i+1]);if(y>0)s+=Gs*(v[i]-v[i-NX]);if(y<NY-1)s+=Gs*(v[i]-v[i+NX]);o[i]=s}return o};
 const th=new Float64Array(n),r=Float64Array.from(q),pp=Float64Array.from(q);let rr=r.reduce((a,v)=>a+v*v,0);const r0=rr;
 for(let it=0;it<4000&&rr>1e-22*r0;it++){const Ap=A(pp);let pAp=0;for(let i=0;i<n;i++)pAp+=pp[i]*Ap[i];const a=rr/pAp;let nr=0;
  for(let i=0;i<n;i++){th[i]+=a*pp[i];r[i]-=a*Ap[i];nr+=r[i]*r[i]}const bta=nr/rr;rr=nr;for(let i=0;i<n;i++)pp[i]=r[i]+bta*pp[i]}
 for(let i=0;i<n;i++)T[i]=amb+th[i];
 let mx=-1e9,mn=1e9,sum=0,mi=0;for(let i=0;i<T.length;i++){if(T[i]>mx){mx=T[i];mi=i}if(T[i]<mn)mn=T[i];sum+=T[i]}
 const avg=sum/T.length,tot=g("hSoc")+g("hPa")+g("hChg")+g("hDisp");
 const cn=$("hCan"),ctx=cn.getContext("2d"),cw=cn.width/NX,ch=cn.height/NY,lo=amb,hi=Math.max(amb+5,Math.ceil(mx/5)*5);
 const stops=[[0,[33,72,140]],[0.25,[46,150,170]],[0.5,[150,200,90]],[0.7,[245,200,60]],[0.85,[235,120,40]],[1,[190,40,40]]];
 const cmap=v=>{const t=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));for(let k=1;k<stops.length;k++){if(t<=stops[k][0]){const a=stops[k-1],b=stops[k],f=(t-a[0])/(b[0]-a[0]);return `rgb(${a[1].map((c,j)=>Math.round(c+(b[1][j]-c)*f)).join(",")})`}}return "rgb(190,40,40)"};
 for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){ctx.fillStyle=cmap(T[y*NX+x]);ctx.fillRect(x*cw,y*ch,Math.ceil(cw),Math.ceil(ch))}
 ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=1.5;[[0.5,0.27,"SoC"],[0.3,0.86,"PA"],[0.72,0.12,"PA"]].forEach(([fx,fy,l])=>{ctx.beginPath();ctx.arc(fx*cn.width,fy*cn.height,10,0,7);ctx.stroke();ctx.fillStyle="rgba(255,255,255,.95)";ctx.font="600 11px system-ui";ctx.fillText(l,fx*cn.width+13,fy*cn.height+4)});
 $("hOut").innerHTML=`<div><span class="label">Hotspot</span><b class="${mx>43?"bad":"ok"}">${mx.toFixed(1)} °C</b></div><div><span class="label">Average</span><b>${avg.toFixed(1)} °C</b></div><div><span class="label">Coolest</span><b>${mn.toFixed(1)} °C</b></div><div><span class="label">Hotspot − average</span><b>${(mx-avg).toFixed(1)} K</b></div><div><span class="label">Total heat</span><b>${tot.toFixed(1)} W</b></div>`;
 let leg=`<span class="label">Temperature (°C)</span><div style="display:grid;grid-template-columns:22px auto;gap:0 8px;margin-top:6px">`;
 for(let k=0;k<=5;k++){const v=hi-(hi-lo)*k/5;leg+=`<div style="height:32px;background:${cmap(v)}"></div><div class="kv" style="align-self:center">${v.toFixed(1)}</div>`}
 leg+=`</div><p class="note2" style="margin-top:10px">${esc(SPR[spr][3])}: sheet conductance ${SPR[spr][2]} W/K. Grid ${NX} × ${NY} cells, both faces convecting with h = ${h} W/m²K.</p>`;
 $("hLeg").innerHTML=leg;
}

eq:[
 ["Thermal Ohm's law","ΔT = P · R_th","Temperatures add along a path like voltages; resistances in K/W."],
 ["Surface to air","R_sa = 1 / (h · A)","h ≈ 11 W/m²K (convection + radiation), A ≈ 0.025 m² gives ≈ 3.7 K/W."],
 ["Radiation coefficient","h_rad ≈ 4·ε·σ·T³","For ε ≈ 0.9 near 310 K, about 5.5–6 W/m²K."],
 ["Time constant","τ = R · C = R · m · c_p","215 g × 0.85 J/gK × 3.7 K/W ≈ 11 minutes."],
 ["Spreading","λ = √(G_sheet / g_conv)","Characteristic spreading length; higher sheet conductance spreads heat over more of the surface."],
 ["Sustained power","P_max = (T_skin − T_amb) / (R_sa · (1 + k_hot))","About 4–5 W for a 43 °C skin limit in a 25 °C room."],
 ["Performance vs power","P ∝ f·V² ≈ f³  →  f ∝ P^(1/3)","With DVFS, halving power costs only about 20% of clock speed; the throttling result uses this."]

<footer>${esc(PAGE.foot||"Representative 2025–2026 flagship architecture. Figures are typical values from public datasheets, standards and teardown estimates; costs are high-volume OEM estimates in USD and vary with volume, contracts and region.")}</footer>`;
app.innerHTML=h;

if(PAGE.init)PAGE.init();

// ---------- auto links from diagram blocks to detail pages ----------
const LINKRULES=[
 [/phase shifter/i,"mmwave.html"],
 [/\bDPD\b|envelope|ET tracker|ET trackers/i,"linearization.html"],
 [/\bLNA\b|low-noise|LNA bank|RF input/i,"lna.html"],
 [/\bPA\b|power stage|driver stage|driver amp|Driver amplifier|PA \/ LNA/i,"pa.html"],
 [/mixer|converter$|up\/down/i,"mixers.html"],
 [/synthesi[sz]er|PLL|LO divider|LO \//i,"synthesizers.html"],
 [/\bADC\b|\bDAC\b/i,"data-converters.html"],
 [/SAW|BAW|duplexer|plexer|Pre-filter|Diplexer/i,"acoustic-filters.html"],
 [/switch|tuner|matrix/i,"rf-switches.html"]
];
const EXTRULES=[
 [/transceiver/i,"transceiver.html"],[/^modem|cellular modem|5G modem/i,"modem.html"],[/^SoC|App processor|SoC /i,"soc.html"],[/GNSS/i,"gnss.html"],
 [/PAMiD|front-end module|in front-end|DRx module|MIMO L-FEM|front end/i,"rf-front-end.html"],
 [/antenna|ANT\d/i,"antennas.html"],[/Wi-Fi/i,"wifi-bluetooth.html"],[/PMIC|charger|battery/i,"power.html"],[/mmWave|AiP/i,"mmwave.html"]
];
function linkFor(b){
 if(D.link&&b.id in D.link)return D.link[b.id];
 const rules=b.cls.includes("ext")?EXTRULES.concat(LINKRULES):LINKRULES.concat(EXTRULES);
 for(const [re,f] of rules){if(re.test(b.label)&&f!==PAGE.file&&PAGES.some(p=>p.file===f))return f}
 return null;
}
// ---------- schematic ----------
const D=PAGE.diagram,CW=D.cw||124,GX=D.gx||42,RH=D.rh||52,GY=30,P=26,TOP=36;
const X=c=>P+c*(CW+GX),Y=r=>TOP+r*(RH+GY);
const W=2*P+D.cols*CW+(D.cols-1)*GX,H=TOP+D.rows*RH+(D.rows-1)*GY+P;
const svg=document.getElementById("sch");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.style.maxWidth=W+"px";
svg.setAttribute("role","img");svg.setAttribute("aria-label","Internal block diagram of "+PAGE.title);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const defs=el("defs",{},svg);
[["rf","var(--ink)"],["dig","var(--ink)"],["ctl","var(--ctl)"],["pwr","var(--pwr)"],["lo","var(--lo)"],["on","var(--copper)"]].forEach(([k,c])=>{
 const m=el("marker",{id:"m-"+k,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);
 el("path",{d:"M0 0 L10 5 L0 10 Z",fill:c},m)});
const B={};
D.blocks.forEach(b=>{const [id,c,r,w=1,hh=1]=b;B[id]={id,x:X(c),y:Y(r),w:w*CW+(w-1)*GX,h:hh*RH+(hh-1)*GY,label:b[5],sym:b[6],cls:b[7]||"",sub:b[8]}});
const gG=el("g",{},svg),eG=el("g",{},svg),bG=el("g",{},svg),lG=el("g",{},svg);
(D.groups||[]).forEach(([c0,r0,c1,r1,lab])=>{
 const x=X(c0)-14,y=Y(r0)-24,w=X(c1)+CW+14-x,hh=Y(r1)+RH+12-y;
 el("rect",{x,y,width:w,height:hh,rx:6,class:"grpf"},gG);el("rect",{x,y,width:w,height:hh,rx:6,class:"grp"},gG);
 const t=el("text",{x:x+10,y:y+14,class:"gl"},gG);t.textContent=lab.toUpperCase();});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function route(a,b,o){
 o=o||0;
 if(b.x>=a.x+a.w||a.x>=b.x+b.w){
  const rgt=b.x>=a.x+a.w,sx=rgt?a.x+a.w:a.x,ex=rgt?b.x:b.x+b.w;
  const lo=Math.max(a.y,b.y),hi=Math.min(a.y+a.h,b.y+b.h);
  if(hi-lo>=6){const y=(lo+hi)/2+(o&&Math.abs(o)<(hi-lo)/2?o:0);return{d:`M${sx} ${y} H${ex}`,lx:(sx+ex)/2,ly:y-5,anc:"middle"}}
  const m=(sx+ex)/2+o,sy=clamp(b.y+b.h/2,a.y+10,a.y+a.h-10),ey=clamp(a.y+a.h/2,b.y+10,b.y+b.h-10);
  return{d:`M${sx} ${sy} H${m} V${ey} H${ex}`,lx:m+5,ly:(sy+ey)/2+3,anc:"start"};
 }
 const down=b.y>=a.y+a.h,sy=down?a.y+a.h:a.y,ey=down?b.y:b.y+b.h;
 const lo=Math.max(a.x,b.x),hi=Math.min(a.x+a.w,b.x+b.w),x=(lo+hi)/2+o;
 return{d:`M${x} ${sy} V${ey}`,lx:x+6,ly:(sy+ey)/2+3,anc:"start"};
}
const edges=D.edges.map(([a,b,t,lab,o])=>{
 const r=route(B[a],B[b],o),p=el("path",{d:r.d,class:"e "+t},eG);
 if(t!=="bus")p.setAttribute("marker-end",`url(#m-${t})`);
 if(lab){const tx=el("text",{x:r.lx,y:r.ly,"text-anchor":r.anc,class:"el"},lG);tx.textContent=lab}
 return{a,b,t,p}});
function wrapT(s,max){const w=s.split(" ");const L=[];let c="";w.forEach(t=>{if(c&&(c+" "+t).length>max){L.push(c);c=t}else c=c?c+" "+t:t});if(c)L.push(c);return L}
const usedSym=new Set(),usedE=new Set(edges.map(e=>e.t));
Object.values(B).forEach(o=>{
 const g=el("g",{class:"b "+o.cls,tabindex:"0",role:"button","aria-label":o.label},bG);
 el("rect",{x:o.x,y:o.y,width:o.w,height:o.h,rx:3,class:"box"},g);
 const gw=o.sym?30:0;
 if(o.sym){usedSym.add(o.sym);const s=el("g",{class:"gy",transform:`translate(${o.x+7} ${o.y+o.h/2-9})`},g);s.innerHTML=G[o.sym];
  el("line",{x1:o.x+gw,x2:o.x+gw,y1:o.y+5,y2:o.y+o.h-5,class:"sep"},g)}
 const avail=o.w-gw-14,lines=wrapT(o.label,Math.max(8,Math.floor(avail/6.1)));
 const n=lines.length+(o.sub?1:0),lh=13,cy=o.y+o.h/2-(n-1)*lh/2+4;
 const tx=o.sym?o.x+gw+8:o.x+o.w/2,anc=o.sym?"start":"middle";
 lines.forEach((ln,k)=>{const t=el("text",{x:tx,y:cy+k*lh,"text-anchor":anc,class:"bt"},g);t.textContent=ln});
 if(o.sub){const t=el("text",{x:tx,y:cy+lines.length*lh,"text-anchor":anc,class:"bs"},g);t.textContent=o.sub}
 o.href=linkFor(o);
 if(o.href){const t=el("text",{x:o.x+o.w-5,y:o.y+12,"text-anchor":"end",class:"lk"},g);t.textContent="↗"}
 const act=()=>focus(o.id);
 g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}});
 g.addEventListener("mouseenter",()=>hi(o.id));g.addEventListener("mouseleave",()=>hi(cur));
 o.g=g;
});
let cur=null;
function hi(id){
 svg.classList.toggle("focus",!!id);
 edges.forEach(e=>{const on=!!id&&(e.a===id||e.b===id);e.p.classList.toggle("on",on);
  if(e.t!=="bus")e.p.setAttribute("marker-end",`url(#m-${on&&(e.t==="rf"||e.t==="dig")?"on":e.t})`)});
 Object.values(B).forEach(o=>o.g.classList.toggle("on",o.id===id));
}
const dd=document.getElementById("ddesc");
function focus(id){
 cur=cur===id?null:id;hi(cur);
 if(!cur){dd.innerHTML=`<span class="label">Reading the diagram</span><p>${esc(D.intro)}</p>`;return}
 const o=B[cur],txt=(D.desc||{})[cur]||"";
 const ins=edges.filter(e=>e.b===cur).map(e=>B[e.a].label),outs=edges.filter(e=>e.a===cur).map(e=>B[e.b].label);
 dd.innerHTML=`<span class="label">${o.cls.includes("ext")?"Outside this module":"Block"}</span><h3>${esc(o.label)}</h3><p>${esc(txt)}</p>${ins.length||outs.length?`<p class="label" style="margin-top:6px">${ins.length?"From: "+ins.map(esc).join(", "):""}${ins.length&&outs.length?" · ":""}${outs.length?"To: "+outs.map(esc).join(", "):""}</p>`:""}${o.href?`<a class="go" href="${o.href}">Open the ${esc((PAGES.find(p=>p.file===o.href)||{short:"detail"}).short)} page →</a>`:""}`;
}
focus(null);
document.getElementById("leg").innerHTML=[...usedE].map(t=>`<span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" class="e ${t}" style="stroke:${t==="ctl"?"var(--ctl)":t==="pwr"?"var(--pwr)":t==="lo"?"var(--lo)":t==="bus"?"var(--copper)":"var(--ink)"};stroke-dasharray:${t==="dig"?"6 3":t==="ctl"?"2 3":t==="pwr"?"1 3":t==="lo"?"9 3 2 3":"0"};stroke-width:${t==="pwr"?2.2:1.6};stroke-linecap:round"/></svg>${EN[t]}</span>`).join("")
 +`<span><svg width="20" height="12"><rect x="0.5" y="0.5" width="19" height="11" fill="var(--sunk)" stroke="var(--wire)" stroke-dasharray="3 2"/></svg>Outside the module</span>`
 +[...new Map([...usedSym].map(k=>[SN[k],k])).values()].map(k=>`<span><svg viewBox="-1 -1 20 20" width="15" height="15" class="gy" style="fill:none;stroke:var(--ink);stroke-width:1.2">${G[k]}</svg>${SN[k]}</span>`).join("");
// also style legend svgs (they are outside .sch)
document.querySelectorAll("#leg svg").forEach(s=>s.querySelectorAll("path,rect,circle").forEach(n=>{if(!n.getAttribute("fill"))n.setAttribute("fill","none")}));
})();
</script>
