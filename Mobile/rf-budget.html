{id:"theory",title:"Reading a budget",toc:"Method",
html:`<div class="theory"><div><h3>Noise</h3>
<p>Thermal noise at the antenna is kTB: −174 dBm/Hz at room temperature, or −101 dBm in 20 MHz. Each stage adds its own noise, but Friis's formula divides a stage's contribution by the gain in front of it, so the first stages dominate. Loss in front of the LNA adds dB for dB; the noise-contribution bar shows this directly.</p>
<p>Sensitivity is the noise floor plus the SNR the demodulator needs. For a QPSK low-code-rate reference channel the required SNR is around −1 dB, which is why sensitivity sits just below the noise floor.</p></div>
<div><h3>Linearity and dynamic range</h3>
<p>Cascaded IIP3 works the other way: a stage's intercept is divided by the gain in front of it, so the last high-gain stages usually limit linearity. Adding LNA gain improves noise but hurts linearity; the budget is the balance between them.</p>
<p>Spurious-free dynamic range is the input range over which the wanted signal is above the noise while third-order products stay below it: SFDR = ⅔(IIP3 − noise floor). AGC extends the usable range by switching gain, at the cost of noise figure in low-gain modes.</p></div></div>`}
],

// [name, gain dB, NF dB, IIP3 dBm, blocker rejection dB]
const PRE={

 "C-band NR receiver (n77, 100 MHz)":{bw:100,snr:-1,sig:-85,blk:-46,st:[["Antenna switch",-0.6,0.6,70,0],["LTCC filter",-1.8,1.8,80,0],["LNA in module",18,1.2,-2,0],["Board trace",-2,2,100,0],["Transceiver LNA2",12,4,-6,0],["Mixer + TIA",8,10,10,6],["Baseband filter + VGA",18,18,15,30],["ADC (noise-equivalent)",0,30,25,0]]},

$("rxTbl").addEventListener("click",e=>{const d=e.target.dataset.del;if(d==null)return;rx.splice(+d,1);drawRxTbl();calcRx()});

let RX={};
function cascade(st){
 // Gb: gain seen by the out-of-channel blocker tones (in-channel gain minus filter rejection).
 // Each stage's IM3 lands in-channel; its input-referred intercept is IIP3_i - 1.5*Gb_before + 0.5*G_before.
 let G=1,F=1,inv=0,Gbdb=0;const out=[],contrib=[];
 st.forEach((r,i)=>{const g=db2l(r[1]),f=db2l(r[2]);
  const ipEff=r[3]-1.5*Gbdb+0.5*l2db(G);
  contrib.push((f-1)/G);F+=(f-1)/G;inv+=1/db2l(ipEff);G*=g;Gbdb+=r[1]-(r[4]||0);
  out.push({G:l2db(G),NF:l2db(F),IIP3:-l2db(inv)});});
 return {out,contrib,F};
}
function f1(v){return (v>=0?"+":"")+v.toFixed(1)}
function calcRx(){
 const bw=Math.max(0.001,+$("rxBw").value)*1e6,snr=+$("rxSnr").value,sig=+$("rxSig").value,blk=+$("rxBlk").value;
 const c=cascade(rx),last=c.out[c.out.length-1]||{G:0,NF:0,IIP3:99};
 const n0=-174+l2db(bw),nf=last.NF,floor=n0+nf,sens=floor+snr,ip3=last.IIP3,sfdr=2/3*(ip3-floor);
 const im3in=3*blk-2*ip3,snrNow=sig-floor,sinr=sig-l2db(db2l(floor)+db2l(im3in));
 RX={floor,nf,ip3,sens,n0,G:last.G,sfdr};
 c.out.forEach((o,i)=>{$("cg"+i).textContent=f1(o.G);$("cn"+i).textContent=o.NF.toFixed(2);$("ci"+i).textContent=f1(o.IIP3)});
 $("rxOut").innerHTML=`<div><span class="label">Total gain</span><b>${f1(last.G)} dB</b></div><div><span class="label">System NF</span><b>${nf.toFixed(2)} dB</b></div><div><span class="label">Input IIP3</span><b>${f1(ip3)} dBm</b></div><div><span class="label">Noise floor</span><b>${f1(floor)} dBm</b></div><div><span class="label">Sensitivity</span><b>${f1(sens)} dBm</b></div><div><span class="label">SFDR</span><b>${sfdr.toFixed(1)} dB</b></div><div><span class="label">SNR of wanted</span><b class="${snrNow<snr?"bad":"ok"}">${snrNow.toFixed(1)} dB</b></div><div><span class="label">SINR with blockers</span><b class="${sinr<snr?"bad":"ok"}">${sinr.toFixed(1)} dB</b></div>`;
 // level diagram
 const pts=[{x:"Antenna",G:0,NF:0,IIP3:99}].concat(c.out.map((o,i)=>({x:rx[i][0],...o})));
 const S=pts.map(p=>sig+p.G),N=pts.map((p,i)=>n0+(i?p.NF:0)+p.G),I=pts.map((p,i)=>(i?3*blk-2*p.IIP3:-999)+p.G);
 const ymin=Math.floor((Math.min(...S,...N)-30)/20)*20,ymax=Math.ceil((Math.max(...S,...N,...I)+10)/20)*20;
 const L=60,R=880,T=16,B=230,X=i=>L+i*(R-L)/(pts.length-1),Y=v=>B-(v-ymin)/(ymax-ymin)*(B-T);
 let s="";for(let v=ymin;v<=ymax;v+=20){s+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`}
 pts.forEach((p,i)=>{s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${B}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(i)}" y="${B+14}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" transform="rotate(0)">${i}</text>`});
 const line=(arr,col,dash)=>`<polyline fill="none" stroke="${col}" stroke-width="2.2" ${dash?`stroke-dasharray="${dash}"`:""} points="${arr.map((v,i)=>v>=ymin?`${X(i)},${Y(v)}`:"").filter(Boolean).join(" ")}"/>`+arr.map((v,i)=>v>=ymin?`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${col}"/>`:"").join("");
 s+=line(S,"var(--lo)")+line(N,"var(--muted)","6 3")+line(I,"var(--copper)","2 3");
 $("rxLvl").setAttribute("viewBox",`0 0 900 ${B+22}`);$("rxLvl").innerHTML=s;
 $("rxLvlLeg").innerHTML=`<span style="color:var(--lo)">━ Wanted signal</span> · <span>╍ Integrated noise in channel</span> · <span style="color:var(--copper)">┄ IM3 from blocker pair (below ${ymin} dBm not drawn)</span><br>Points are stage outputs: 0 antenna · ${pts.slice(1).map((p,i)=>`${i+1} ${esc(p.x)}`).join(" · ")}`;
 // noise contributions
 const tot=c.F,parts=[{n:"Source (kTB)",v:1/tot}].concat(c.contrib.map((v,i)=>({n:rx[i][0],v:v/tot})));
 let x=L,h=`<text x="${L}" y="14">Share of output noise by stage</text>`;
 const cols=["var(--sunk)","var(--copper)","var(--lo)","var(--pwr)","var(--ok)","var(--ink)","var(--wire)","var(--ctl)"];
 parts.forEach((p,i)=>{const w=p.v*(R-L);h+=`<rect x="${x}" y="22" width="${Math.max(0,w)}" height="26" fill="${cols[i%cols.length]}" stroke="var(--surface)"><title>${esc(p.n)}: ${(p.v*100).toFixed(1)}%</title></rect>`;x+=w});
 let lx=L,ly=70;parts.forEach((p,i)=>{const lab=`${p.n} ${(p.v*100).toFixed(1)}%`,w=lab.length*6.2+24;if(lx+w>R){lx=L;ly+=16}h+=`<rect x="${lx}" y="${ly-9}" width="10" height="10" fill="${cols[i%cols.length]}" stroke="var(--line)"/><text x="${lx+14}" y="${ly}">${esc(lab)}</text>`;lx+=w});
 $("rxNc").setAttribute("viewBox",`0 0 900 ${ly+10}`);$("rxNc").innerHTML=h;
 calcTx();calcDr();
}
// ---------- TX ----------
let tx=[["PA module (driver + power stage)",27.5],["Band select switch",-0.3],["Duplexer (TX)",-1.8],["Coupler",-0.2],["Antenna switch",-0.4],["Tuner + matching",-0.4],["Trace / feed",-0.3]];
function drawTxTbl(){
 $("txTbl").innerHTML=`<thead><tr><th>#</th><th>Stage</th><th>Gain (dB)</th><th>Power after (dBm)</th><th></th></tr></thead><tbody>`+tx.map((r,i)=>`<tr><td class="n">${i+1}</td><td><input class="nm" data-i="${i}" data-k="0" value="${esc(r[0])}" aria-label="Stage name"></td><td><input type="number" step="0.1" data-i="${i}" data-k="1" value="${r[1]}" aria-label="Gain of ${esc(r[0])}"></td><td class="n" id="tp${i}"></td><td><button class="btn2" data-del="${i}" aria-label="Remove">×</button></td></tr>`).join("")+`</tbody>`;
}
$("txTbl").addEventListener("input",e=>{const t=e.target;if(t.dataset.i==null)return;const i=+t.dataset.i,k=+t.dataset.k;tx[i][k]=k?parseFloat(t.value)||0:t.value;calcTx()});
$("txTbl").addEventListener("click",e=>{const d=e.target.dataset.del;if(d==null)return;tx.splice(+d,1);drawTxTbl();calcTx()});
$("txAdd").onclick=()=>{tx.push(["New stage",-0.5]);drawTxTbl();calcTx()};
["txStart","txEff","txTgt","txNoise","txIsoR","txIsoT","txIp2"].forEach(i=>$(i).addEventListener("input",calcTx));
function calcTx(){
 const p0=+$("txStart").value,eff=+$("txEff").value,tgt=+$("txTgt").value;
 let p=p0;const P=[p0],paIdx=tx.findIndex(r=>/PA/i.test(r[0]));let paOut=null;
 tx.forEach((r,i)=>{p+=r[1];P.push(p);const el=$("tp"+i);if(el)el.textContent=f1(p);if(i===paIdx)paOut=p});
 const ant=p,trp=ant+eff,loss=paOut!=null?paOut-ant:0;
 const nRx=+$("txNoise").value-+$("txIsoR").value,nfFloor=-174+(RX.nf||6);
 const des=l2db(1+db2l(nRx-nfFloor));
 const leak=(paOut!=null?paOut:ant)-+$("txIsoT").value,im2=2*leak-+$("txIp2").value;
 const imdes=l2db(1+db2l(im2-(RX.floor||-95)));
 $("txOut").innerHTML=`<div><span class="label">Power at antenna port</span><b class="${ant<tgt?"bad":"ok"}">${f1(ant)} dBm</b></div><div><span class="label">Margin to target</span><b class="${ant<tgt?"bad":"ok"}">${f1(ant-tgt)} dB</b></div><div><span class="label">Radiated (TRP)</span><b>${f1(trp)} dBm</b></div><div><span class="label">Loss after PA</span><b>${loss.toFixed(1)} dB</b></div><div><span class="label">TX noise at LNA</span><b>${f1(nRx)} dBm/Hz</b></div><div><span class="label">Desense from TX noise</span><b class="${des>0.5?"bad":"ok"}">${des.toFixed(2)} dB</b></div><div><span class="label">TX leakage at LNA</span><b>${f1(leak)} dBm</b></div><div><span class="label">Desense from leakage IM2</span><b class="${imdes>0.5?"bad":"ok"}">${imdes.toFixed(2)} dB</b></div>`;
 const L=60,R=880,T=14,B=180,ymin=Math.floor((Math.min(...P)-5)/10)*10,ymax=Math.ceil((Math.max(...P,tgt)+5)/10)*10;
 const X=i=>L+i*(R-L)/Math.max(1,P.length-1),Y=v=>B-(v-ymin)/(ymax-ymin)*(B-T);
 let s="";for(let v=ymin;v<=ymax;v+=10){s+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`}
 s+=`<line x1="${L}" x2="${R}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--ok)" stroke-dasharray="5 3"/><text x="${L+6}" y="${Y(tgt)+13}" style="fill:var(--ok)">target ${tgt} dBm at antenna port</text>`;
 s+=`<polyline fill="none" stroke="var(--copper)" stroke-width="2.4" points="${P.map((v,i)=>`${X(i)},${Y(v)}`).join(" ")}"/>`+P.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--copper)"/><text x="${X(i)}" y="${B+14}" text-anchor="middle">${i}</text>`).join("");
 $("txLvl").setAttribute("viewBox",`0 0 900 ${B+22}`);$("txLvl").innerHTML=s;
 $("txLvlLeg").innerHTML=`Points: 0 transceiver output · ${tx.map((r,i)=>`${i+1} ${esc(r[0])}`).join(" · ")}`;
}
// ---------- dynamic range ----------
["drMax","drPapr","drAgc","drMargin","drBlk"].forEach(i=>$(i).addEventListener("input",calcDr));
function calcDr(){
 if(RX.floor==null)return;
 const mx=+$("drMax").value,papr=+$("drPapr").value,agc=+$("drAgc").value,mg=+$("drMargin").value,bh=+$("drBlk").value;
 const p1=RX.ip3-9.6,sfdrTop=(2*RX.ip3+RX.floor)/3;
 const inst=sfdrTop-RX.floor,total=mx-RX.sens,adc=papr+mg+bh+Math.max(0,total-agc);
 $("drOut").innerHTML=`<div><span class="label">Instantaneous SFDR</span><b>${inst.toFixed(1)} dB</b></div><div><span class="label">Required total range</span><b>${total.toFixed(1)} dB</b></div><div><span class="label">Covered by AGC</span><b>${Math.min(agc,total).toFixed(0)} dB</b></div><div><span class="label">ADC range needed</span><b>${adc.toFixed(1)} dB</b></div><div><span class="label">≈ ADC bits</span><b>${((adc-1.76)/6.02).toFixed(1)}</b></div>`;
 const lv=[["kTB in channel",RX.n0,"var(--muted)"],["Receiver noise floor",RX.floor,"var(--muted)"],["Sensitivity",RX.sens,"var(--lo)"],["Top of SFDR (IM3 = noise)",sfdrTop,"var(--copper)"],["Input P1dB (≈ IIP3 − 9.6)",p1,"var(--copper)"],["Maximum wanted input",mx,"var(--ok)"],["Cascaded IIP3",RX.ip3,"var(--ink)"]].sort((a,b)=>a[1]-b[1]);
 const vmin=Math.floor((lv[0][1]-10)/10)*10,vmax=Math.ceil((lv[lv.length-1][1]+10)/10)*10,T=16,B=340,Y=v=>B-(v-vmin)/(vmax-vmin)*(B-T),ax=120;
 let s="";for(let v=vmin;v<=vmax;v+=10){s+=`<line x1="${ax}" x2="${ax+6}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--muted)"/><text x="${ax-6}" y="${Y(v)+3}" text-anchor="end">${v} dBm</text>`}
 s+=`<line x1="${ax}" x2="${ax}" y1="${T}" y2="${B}" stroke="var(--muted)"/>`;
 let lastY=1e9;lv.forEach(([n,v,c])=>{let ty=Y(v)+3;if(lastY-ty<13)ty=lastY-13;lastY=ty;s+=`<line x1="${ax}" x2="${ax+250}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-width="1.6"/><text x="${ax+258}" y="${ty}" style="fill:${c}">${esc(n)}: ${f1(v)} dBm</text>`});
 const bar=(x,y0,y1,c,t)=>`<rect x="${x}" y="${Y(y1)}" width="34" height="${Math.max(1,Y(y0)-Y(y1))}" fill="${c}" opacity=".85"/><text x="${x+17}" y="${B+16}" text-anchor="middle">${t}</text>`;
 s+=bar(ax+20,RX.floor,sfdrTop,"var(--copper)","SFDR")+bar(ax+70,RX.sens,mx,"var(--lo)","Needed")+bar(ax+120,RX.sens,Math.min(mx,RX.sens+agc+inst),"var(--ok)","AGC+SFDR");
 $("drLad").setAttribute("viewBox",`0 0 900 ${B+24}`);$("drLad").innerHTML=s;
}
drawTxTbl();loadPre();
},

 ["Thermal noise","N = −174 dBm/Hz + 10·log10(B)","kT at 290 K. 20 MHz gives −101 dBm; 100 MHz gives −94 dBm."],

<script>
(function(){
const NS="http://www.w3.org/2000/svg";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G={

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function route(a,b,o){
 o=o||0;
 if(b.x>=a.x+a.w||a.x>=b.x+b.w){
  const rgt=b.x>=a.x+a.w,sx=rgt?a.x+a.w:a.x,ex=rgt?b.x:b.x+b.w;
