.sch .sep{stroke:var(--line)}
.sch .gy{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.sch .e{fill:none;stroke-width:1.4;transition:opacity .15s}
.sch .e.rf{stroke:var(--ink)}
.sch .e.dig{stroke:var(--ink);stroke-dasharray:6 3;stroke-width:1.2}
.sch .e.ctl{stroke:var(--ctl);stroke-dasharray:2 3;stroke-width:1.2}
.sch .e.pwr{stroke:var(--pwr);stroke-dasharray:1 3;stroke-width:2.2;stroke-linecap:round}
.sch .e.lo{stroke:var(--lo);stroke-dasharray:9 3 2 3}

init(){
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Illustrative calibration: power at antenna vs gain index (RGI 0..63) per PA state and channel (low/mid/high)
const ST=[["High-gain",4,27.5,0.66,8,[0.6,0,-0.8]],["Mid-gain",-14,13,0.5,-4,[0.4,0,-0.5]],["Low-gain",-48,0,0.82,-60,[0.3,0,-0.3]]];// name, Pmin@RGI0, Psat, slope, switch threshold, channel offsets
const curve=(s,rgi,chOff)=>{const lin=s[1]+s[3]*rgi+chOff;return s[2]-Math.log(1+Math.exp((s[2]-lin)*1.6))/1.6};// soft compression
const TC=-0.025;// dB per °C gain drift
function chOffset(s,pos){const o=s[5],x=pos/100;return x<0.5?o[0]+(o[1]-o[0])*x*2:o[1]+(o[2]-o[1])*(x-0.5)*2}
["uP0","uA","uPL","uRB","uMu","uF","uPc","uMpr","uSar","uCh","uT"].forEach(i=>$(i).addEventListener("input",calc));
function calc(){
 const P0=+$("uP0").value,a=+$("uA").value,PL=+$("uPL").value,RB=Math.max(1,+$("uRB").value),mu=+$("uMu").value,f=+$("uF").value,pc=+$("uPc").value,mpr=+$("uMpr").value,sar=+$("uSar").value,ch=+$("uCh").value,T=+$("uT").value;
 $("oPL").textContent=PL+" dB";$("oCh").textContent=ch+"%";$("oT").textContent=T+" °C";
 const req=P0+10*Math.log10(Math.pow(2,mu)*RB)+a*PL+f;
 const pcmax=pc-mpr-sar,target=Math.min(pcmax,req),phr=pcmax-req;
 const si=target>ST[0][4]?0:target>ST[1][4]?1:2,s=ST[si];
 const co=chOffset(s,ch),tc=TC*(T-25);
 // open loop: find rgi giving target (with temperature comp applied to the prediction)
 let rgi=0;for(let r=0;r<=63;r++){if(curve(s,r,co)+tc>=target-0.15){rgi=r;break}rgi=r}
 const pred=curve(s,rgi,co)+tc,sat=curve(s,63,co)+tc;
 // what you'd get without temperature compensation
 let rgiNo=0;for(let r=0;r<=63;r++){if(curve(s,r,co)>=target-0.15){rgiNo=r;break}rgiNo=r}
 const actNo=curve(s,rgiNo,co)+tc;
 const loop=si===0&&target>8;
 $("uOut").innerHTML=`<div><span class="label">Required power</span><b>${req.toFixed(1)} dBm</b></div><div><span class="label">P_CMAX</span><b>${pcmax.toFixed(1)} dBm</b></div><div><span class="label">Target</span><b class="${req>pcmax?"bad":"ok"}">${target.toFixed(1)} dBm</b></div><div><span class="label">Power headroom</span><b class="${phr<0?"bad":"ok"}">${phr.toFixed(1)} dB</b></div><div><span class="label">PA state</span><b>${s[0]}</b></div><div><span class="label">Gain index</span><b>${rgi}</b></div><div><span class="label">Error without temp. comp.</span><b class="${Math.abs(actNo-target)>1?"bad":""}">${(actNo-target).toFixed(1)} dB</b></div>`;
 // chart
 const L=60,R=880,Tt=14,B=280,ymin=-50,ymax=30,X=r=>L+r/63*(R-L),Y=v=>B-(v-ymin)/(ymax-ymin)*(B-Tt);
 let h="";for(let v=ymin;v<=ymax;v+=10){h+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`}
 for(let r=0;r<=63;r+=7){h+=`<text x="${X(r)}" y="${B+14}" text-anchor="middle">${r}</text>`}
 const cols=["var(--copper)","var(--lo)","var(--ok)"];
 ST.forEach((st,k)=>{[0,0.5,1].forEach((p,j)=>{const off=chOffset(st,p*100);const pts=[];for(let r=0;r<=63;r++)pts.push(`${X(r)},${Y(curve(st,r,off))}`);h+=`<polyline fill="none" stroke="${cols[k]}" stroke-width="${k===si?2.2:1.2}" stroke-dasharray="${j===1?"":j===0?"5 3":"1 3"}" opacity="${k===si?1:.45}" points="${pts.join(" ")}"/>`})});
 h+=`<line x1="${L}" x2="${R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${R-4}" y="${Y(target)-5}" text-anchor="end" style="fill:var(--ink)">target ${target.toFixed(1)} dBm</text>`;
 h+=`<circle cx="${X(rgi)}" cy="${Y(pred)}" r="6" fill="none" stroke="var(--ink)" stroke-width="2.4"/>`;
 h+=`<text x="${(L+R)/2}" y="${B+32}" text-anchor="middle">Transceiver gain index (RGI)</text><text x="14" y="${(Tt+B)/2}" transform="rotate(-90 14 ${(Tt+B)/2})" text-anchor="middle">Power at antenna (dBm)</text>`;
 $("uCal").innerHTML=h;
 $("uLeg").innerHTML=ST.map((st,k)=>`<span style="display:inline-flex;gap:6px;align-items:center;margin-right:14px"><i style="display:inline-block;width:22px;height:3px;background:${cols[k]}"></i>${st[0]} PA state</span>`).join("")+`<span>Line style: dashed = low channel, solid = mid, dotted = high. The circle marks the chosen gain index.</span>`;
 const steps=[
  [`Network parameters and path loss give a required power of ${req.toFixed(1)} dBm (P0 ${P0} + 10·log10(2^${mu}·${RB}) + ${a}·${PL} + ${f}).`],
  [`P_CMAX = ${pc} − ${mpr} (MPR) − ${sar} (SAR) = ${pcmax.toFixed(1)} dBm.${req>pcmax?" The phone is power-limited; it reports negative headroom so the network can reduce the allocation.":""}`],
  [`Target ${target.toFixed(1)} dBm selects the ${s[0].toLowerCase()} PA state (switch points with hysteresis keep it from toggling).`],
  [`Calibration tables for this band are interpolated to the channel (${co>=0?"+":""}${co.toFixed(2)} dB) and the temperature drift is added (${tc>=0?"+":""}${tc.toFixed(2)} dB at ${T} °C).`],
  [`The lowest gain index reaching the target is ${rgi}, predicting ${pred.toFixed(1)} dBm. Without temperature compensation the PA would deliver ${actNo.toFixed(1)} dBm.`],
  [loop?`Above about 8 dBm the feedback receiver measures the real output and trims the next slot's setting, removing the remaining error.`:`At this low power the feedback receiver is too noisy to trust, so the open-loop calibration alone sets the accuracy.`],
  [`Writes go out as timed transceiver and MIPI RFFE commands that take effect at the next symbol boundary.`]];
 $("uSteps").innerHTML=`<ol class="note2" style="color:var(--ink);display:grid;gap:4px;padding-left:20px;margin:0">${steps.map(x=>`<li>${esc(x[0])}</li>`).join("")}</ol>`;
}
calc();
},
how:[
 ["Why RF lives in the modem",["Front-end settings must change exactly at slot and symbol boundaries: switching bands for a measurement gap, changing PA gain between slots, moving SRS between antennas. Only the modem knows the slot timeline, so its firmware owns every RF device. Android supplies only slow inputs such as SAR backoff and thermal limits."]],

if(rel.length){toc.push(["related","Related"]);h+=sec("related","Related pages","",`<div class="rel">${rel.map(p=>`<a href="${p.file}"><span class="label">${esc(p.group)}</span><b>${esc(p.short)}</b></a>`).join("")}</div>`)}
h+=`<nav class="pn" aria-label="Previous and next"><a href="${prev.file}"><span class="label">← Previous</span><b>${esc(prev.short)}</b></a><a class="nx" href="${next.file}"><span class="label">Next →</span><b>${esc(next.short)}</b></a></nav>
<footer>${esc(PAGE.foot||"Representative 2025–2026 flagship architecture. Figures are typical values from public datasheets, standards and teardown estimates; costs are high-volume OEM estimates in USD and vary with volume, contracts and region.")}</footer>`;
app.innerHTML=h;
document.getElementById("toc").innerHTML=`<span class="label">On this page</span>`+toc.map(([i,t])=>`<a href="#${i}">${esc(t)}</a>`).join("");
if(PAGE.init)PAGE.init();
if(!PAGE.diagram)return;
// ---------- auto links from diagram blocks to detail pages ----------
const LINKRULES=[
 [/phase shifter/i,"mmwave.html"],
 [/\bDPD\b|envelope|ET tracker|ET trackers/i,"linearization.html"],
 [/\bLNA\b|low-noise|LNA bank|RF input/i,"lna.html"],
 [/\bPA\b|power stage|driver stage|driver amp|Driver amplifier|PA \/ LNA/i,"pa.html"],
 [/mixer|converter$|up\/down/i,"mixers.html"],
 [/synthesi[sz]er|PLL|LO divider|LO \//i,"synthesizers.html"],
 [/\bADC\b|\bDAC\b/i,"data-converters.html"],
 [/SAW|BAW|duplexer|plexer|Pre-filter|Diplexer/i,"acoustic-filters.html"],
 [/switch|tuner|matrix/i,"rf-switches.html"]
];
const EXTRULES=[
 [/transceiver/i,"transceiver.html"],[/^modem|cellular modem|5G modem/i,"modem.html"],[/^SoC|App processor|SoC /i,"soc.html"],[/GNSS/i,"gnss.html"],
 [/PAMiD|front-end module|in front-end|DRx module|MIMO L-FEM|front end/i,"rf-front-end.html"],
 [/antenna|ANT\d/i,"antennas.html"],[/Wi-Fi/i,"wifi-bluetooth.html"],[/PMIC|charger|battery/i,"power.html"],[/mmWave|AiP/i,"mmwave.html"]
];
function linkFor(b){
 if(D.autolink===false)return (D.link&&D.link[b.id])||null;
 if(D.link&&b.id in D.link)return D.link[b.id];
 const rules=b.cls.includes("ext")?EXTRULES.concat(LINKRULES):LINKRULES.concat(EXTRULES);
 for(const [re,f] of rules){if(re.test(b.label)&&f!==PAGE.file&&PAGES.some(p=>p.file===f))return f}
 return null;
}
// ---------- schematic ----------
const D=PAGE.diagram,CW=D.cw||124,GX=D.gx||42,RH=D.rh||52,GY=D.gy||30,P=26,TOP=36;
const X=c=>P+c*(CW+GX),Y=r=>TOP+r*(RH+GY);
const W=2*P+D.cols*CW+(D.cols-1)*GX,H=TOP+D.rows*RH+(D.rows-1)*GY+P;
const svg=document.getElementById("sch");
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.style.maxWidth=W+"px";
svg.setAttribute("role","img");svg.setAttribute("aria-label","Internal block diagram of "+PAGE.title);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const defs=el("defs",{},svg);
[["rf","var(--ink)"],["dig","var(--ink)"],["ctl","var(--ctl)"],["pwr","var(--pwr)"],["lo","var(--lo)"],["on","var(--copper)"]].forEach(([k,c])=>{
 const m=el("marker",{id:"m-"+k,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);
 el("path",{d:"M0 0 L10 5 L0 10 Z",fill:c},m)});
const B={};
D.blocks.forEach(b=>{const [id,c,r,w=1,hh=1]=b;B[id]={id,x:X(c),y:Y(r),w:w*CW+(w-1)*GX,h:hh*RH+(hh-1)*GY,label:b[5],sym:b[6],cls:b[7]||"",sub:b[8]}});
const gG=el("g",{},svg),eG=el("g",{},svg),bG=el("g",{},svg),lG=el("g",{},svg);
(D.groups||[]).forEach(([c0,r0,c1,r1,lab])=>{
 const x=X(c0)-14,y=Y(r0)-24,w=X(c1)+CW+14-x,hh=Y(r1)+RH+12-y;
 el("rect",{x,y,width:w,height:hh,rx:6,class:"grpf"},gG);el("rect",{x,y,width:w,height:hh,rx:6,class:"grp"},gG);
 const t=el("text",{x:x+10,y:y+14,class:"gl"},gG);t.textContent=lab.toUpperCase();});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function route(a,b,o){
 o=o||0;
 if(b.x>=a.x+a.w||a.x>=b.x+b.w){
  const rgt=b.x>=a.x+a.w,sx=rgt?a.x+a.w:a.x,ex=rgt?b.x:b.x+b.w;
  const lo=Math.max(a.y,b.y),hi=Math.min(a.y+a.h,b.y+b.h);
  if(hi-lo>=6){const y=(lo+hi)/2+(o&&Math.abs(o)<(hi-lo)/2?o:0);return{d:`M${sx} ${y} H${ex}`,lx:(sx+ex)/2,ly:y-5,anc:"middle"}}
  const m=(sx+ex)/2+o,sy=clamp(b.y+b.h/2,a.y+10,a.y+a.h-10),ey=clamp(a.y+a.h/2,b.y+10,b.y+b.h-10);
  return{d:`M${sx} ${sy} H${m} V${ey} H${ex}`,lx:m+5,ly:(sy+ey)/2+3,anc:"start"};
 }
 const down=b.y>=a.y+a.h,sy=down?a.y+a.h:a.y,ey=down?b.y:b.y+b.h;
 const lo=Math.max(a.x,b.x),hi=Math.min(a.x+a.w,b.x+b.w),x=(lo+hi)/2+o;
 return{d:`M${x} ${sy} V${ey}`,lx:x+6,ly:(sy+ey)/2+3,anc:"start"};
}
const edges=D.edges.map(([a,b,t,lab,o])=>{
 const r=route(B[a],B[b],o),p=el("path",{d:r.d,class:"e "+t},eG);
 if(t!=="bus")p.setAttribute("marker-end",`url(#m-${t})`);
 if(lab){const tx=el("text",{x:r.lx,y:r.ly,"text-anchor":r.anc,class:"el"},lG);tx.textContent=lab}
 return{a,b,t,p}});
function wrapT(s,max){const w=s.split(" ");const L=[];let c="";w.forEach(t=>{if(c&&(c+" "+t).length>max){L.push(c);c=t}else c=c?c+" "+t:t});if(c)L.push(c);return L}
const usedSym=new Set(),usedE=new Set(edges.map(e=>e.t));
Object.values(B).forEach(o=>{
 const g=el("g",{class:"b "+o.cls,tabindex:"0",role:"button","aria-label":o.label},bG);
 el("rect",{x:o.x,y:o.y,width:o.w,height:o.h,rx:3,class:"box"},g);
 const gw=o.sym?30:0;
 if(o.sym){usedSym.add(o.sym);const s=el("g",{class:"gy",transform:`translate(${o.x+7} ${o.y+o.h/2-9})`},g);s.innerHTML=G[o.sym];
  el("line",{x1:o.x+gw,x2:o.x+gw,y1:o.y+5,y2:o.y+o.h-5,class:"sep"},g)}
 const avail=o.w-gw-14,lines=wrapT(o.label,Math.max(8,Math.floor(avail/6.1)));
 const n=lines.length+(o.sub?1:0),lh=13,cy=o.y+o.h/2-(n-1)*lh/2+4;
 const tx=o.sym?o.x+gw+8:o.x+o.w/2,anc=o.sym?"start":"middle";
 lines.forEach((ln,k)=>{const t=el("text",{x:tx,y:cy+k*lh,"text-anchor":anc,class:"bt"},g);t.textContent=ln});
 if(o.sub){const t=el("text",{x:tx,y:cy+lines.length*lh,"text-anchor":anc,class:"bs"},g);t.textContent=o.sub}
 o.href=linkFor(o);
 if(o.href){const t=el("text",{x:o.x+o.w-5,y:o.y+12,"text-anchor":"end",class:"lk"},g);t.textContent="↗"}
 const act=()=>focus(o.id);
 g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}});
 g.addEventListener("mouseenter",()=>hi(o.id));g.addEventListener("mouseleave",()=>hi(cur));
 o.g=g;
});
let cur=null;
function hi(id){
 svg.classList.toggle("focus",!!id);
 edges.forEach(e=>{const on=!!id&&(e.a===id||e.b===id);e.p.classList.toggle("on",on);
  if(e.t!=="bus")e.p.setAttribute("marker-end",`url(#m-${on&&(e.t==="rf"||e.t==="dig")?"on":e.t})`)});
 Object.values(B).forEach(o=>o.g.classList.toggle("on",o.id===id));
}
const dd=document.getElementById("ddesc");
function focus(id){
 cur=cur===id?null:id;hi(cur);
 if(!cur){dd.innerHTML=`<span class="label">Reading the diagram</span><p>${esc(D.intro)}</p>`;return}
 const o=B[cur],txt=(D.desc||{})[cur]||"";
 const ins=edges.filter(e=>e.b===cur).map(e=>B[e.a].label),outs=edges.filter(e=>e.a===cur).map(e=>B[e.b].label);
 dd.innerHTML=`<span class="label">${o.cls.includes("ext")?"Outside this module":"Block"}</span><h3>${esc(o.label)}</h3><p>${esc(txt)}</p>${ins.length||outs.length?`<p class="label" style="margin-top:6px">${ins.length?"From: "+ins.map(esc).join(", "):""}${ins.length&&outs.length?" · ":""}${outs.length?"To: "+outs.map(esc).join(", "):""}</p>`:""}${o.href?`<a class="go" href="${o.href}">Open the ${esc((PAGES.find(p=>p.file===o.href)||{short:"detail"}).short)} page →</a>`:""}`;
}
focus(null);
const usedL=[...new Set(Object.values(B).map(o=>(o.cls.match(/\bL(app|fw|hal|kern|sec|co|boot)\b/)||[])[1]).filter(Boolean))];
document.getElementById("leg").innerHTML=usedL.map(k=>{const m={app:"Apps",fw:"OS framework",hal:"HAL & vendor services",kern:"Kernel & drivers",sec:"Secure world",co:"Co-processor firmware",boot:"Boot, ROM & config"};return `<span><svg width="20" height="12"><rect x="0.5" y="0.5" width="19" height="11" fill="color-mix(in oklab,var(--L-${k}) 12%,var(--surface))" stroke="var(--L-${k})" stroke-width="1.4"/></svg>${m[k]}</span>`}).join("")+[...usedE].map(t=>`<span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" class="e ${t}" style="stroke:${t==="ctl"?"var(--ctl)":t==="pwr"?"var(--pwr)":t==="lo"?"var(--lo)":t==="bus"?"var(--copper)":"var(--ink)"};stroke-dasharray:${t==="dig"?"6 3":t==="ctl"?"2 3":t==="pwr"?"1 3":t==="lo"?"9 3 2 3":"0"};stroke-width:${t==="pwr"?2.2:1.6};stroke-linecap:round"/></svg>${EN[t]}</span>`).join("")
 +`<span><svg width="20" height="12"><rect x="0.5" y="0.5" width="19" height="11" fill="var(--sunk)" stroke="var(--wire)" stroke-dasharray="3 2"/></svg>Outside the module</span>`
 +[...new Map([...usedSym].map(k=>[SN[k],k])).values()].map(k=>`<span><svg viewBox="-1 -1 20 20" width="15" height="15" class="gy" style="fill:none;stroke:var(--ink);stroke-width:1.2">${G[k]}</svg>${SN[k]}</span>`).join("");
// also style legend svgs (they are outside .sch)
document.querySelectorAll("#leg svg").forEach(s=>s.querySelectorAll("path,rect,circle").forEach(n=>{if(!n.getAttribute("fill"))n.setAttribute("fill","none")}));
})();
</script>
