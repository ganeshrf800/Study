<title>Phone Software Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Module page: title block, signal-flow schematic as the centerpiece, then explanation, architecture table, challenges, specs, parts. */
:root{
  --bg:#eef1ef; --surface:#fbfcfb; --sunk:#e4e9e6; --ink:#15211c; --muted:#56655f; --line:#c8d1cd; --wire:#8d9c96;
  --copper:#b8521a; --copper-soft:#f3dccd; --ok:#2e7d4f; --lo:#4054ad; --pwr:#9a7410; --ctl:#7a8a84;
  --L-app:#2f6db0; --L-fw:#3f8f8a; --L-hal:#6b8f2a; --L-kern:#a0701a; --L-sec:#b0423a; --L-co:#7a4fa3; --L-boot:#4a5560;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1311; --surface:#141c19; --sunk:#1b2521; --ink:#e2eae6; --muted:#93a39c; --line:#2a3732; --wire:#5f726a;
  --copper:#f08a4b; --copper-soft:#3a2416; --ok:#6fcf97; --lo:#8b9cf0; --pwr:#e2bb4f; --ctl:#7f918a; --L-app:#7fb0ec; --L-fw:#6cc6bf; --L-hal:#a8cc66; --L-kern:#e3b45a; --L-sec:#ef8a80; --L-co:#bb97e3; --L-boot:#a7b3be; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#141c19; --sunk:#1b2521; --ink:#e2eae6; --muted:#93a39c; --line:#2a3732; --wire:#5f726a;
  --copper:#f08a4b; --copper-soft:#3a2416; --ok:#6fcf97; --lo:#8b9cf0; --pwr:#e2bb4f; --ctl:#7f918a; --L-app:#7fb0ec; --L-fw:#6cc6bf; --L-hal:#a8cc66; --L-kern:#e3b45a; --L-sec:#ef8a80; --L-co:#bb97e3; --L-boot:#a7b3be; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;padding:0 16px}
a{color:var(--copper)}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 64px;display:grid;gap:22px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.home{font-family:var(--mono);font-size:12px;text-decoration:none;letter-spacing:.04em}
.home:hover{text-decoration:underline}
.modnav{display:flex;flex-wrap:wrap;gap:6px}
.modnav a{font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:999px}
.modnav a:hover{border-color:var(--copper)}
.modnav a[aria-current="page"]{background:var(--copper);border-color:var(--copper);color:var(--surface)}
header.hdr{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px 32px;border-bottom:2px solid var(--ink);padding-bottom:16px}
@media (max-width:860px){header.hdr{grid-template-columns:1fr}}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
h1{font-family:var(--display);font-stretch:66%;font-weight:800;font-size:clamp(38px,6.5vw,72px);line-height:.92;margin:6px 0 10px;text-transform:uppercase;text-wrap:balance}
.lede{margin:0;max-width:64ch;font-size:17px;color:var(--muted)}
.costbox{border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:grid;gap:4px;align-self:end}
.costbox .amt{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--copper);font-variant-numeric:tabular-nums;line-height:1.1}
.costbox small{color:var(--muted);font-size:12.5px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);background:var(--surface)}
.stats div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.toc{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.toc a{text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--copper)}
section.blk{background:var(--surface);border:1px solid var(--line);min-width:0;scroll-margin-top:16px}
.bh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;justify-content:space-between}
h2{font-family:var(--display);font-stretch:70%;font-weight:800;font-size:24px;margin:0;text-transform:uppercase}
.bh p{margin:0;color:var(--muted);font-size:13px;max-width:72ch}
.scroll{overflow-x:auto}
svg.sch{display:block;height:auto;min-width:760px;width:100%}
.sch text{font-family:var(--body);fill:var(--ink)}
.sch .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;fill:var(--muted)}
.sch .grp{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:6 4}
.sch .grpf{fill:color-mix(in oklab,var(--sunk) 35%,var(--surface))}
.sch .b rect.box{fill:var(--surface);stroke:var(--ink);stroke-width:1.1;transition:stroke-width .12s}
.sch .b.ext rect.box{fill:var(--sunk);stroke:var(--wire);stroke-dasharray:4 3}
.sch .b.bus rect.box{fill:color-mix(in oklab,var(--copper) 10%,var(--surface));stroke:var(--copper)}
.sch .b.hl rect.box{stroke:var(--copper);stroke-width:1.6}
.sch .b{cursor:pointer}
.sch .b:hover rect.box,.sch .b.on rect.box{stroke:var(--copper);stroke-width:2.2}
.sch .b.Lapp rect.box{fill:color-mix(in oklab,var(--L-app) 12%,var(--surface));stroke:var(--L-app);stroke-width:1.4}
.sch .b.Lfw rect.box{fill:color-mix(in oklab,var(--L-fw) 12%,var(--surface));stroke:var(--L-fw);stroke-width:1.4}
.sch .b.Lhal rect.box{fill:color-mix(in oklab,var(--L-hal) 12%,var(--surface));stroke:var(--L-hal);stroke-width:1.4}
.sch .b.Lkern rect.box{fill:color-mix(in oklab,var(--L-kern) 12%,var(--surface));stroke:var(--L-kern);stroke-width:1.4}
.sch .b.Lsec rect.box{fill:color-mix(in oklab,var(--L-sec) 12%,var(--surface));stroke:var(--L-sec);stroke-width:1.4}
.sch .b.Lco rect.box{fill:color-mix(in oklab,var(--L-co) 12%,var(--surface));stroke:var(--L-co);stroke-width:1.4}
.sch .b.Lboot rect.box{fill:color-mix(in oklab,var(--L-boot) 12%,var(--surface));stroke:var(--L-boot);stroke-width:1.4}
.sch .bt{font-size:11.2px;font-weight:600;font-stretch:90%}
.sch .bs{font-family:var(--mono);font-size:9px;fill:var(--muted)}
.sch .sep{stroke:var(--line)}
.sch .gy{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.sch .e{fill:none;stroke-width:1.4;transition:opacity .15s}
.sch .e.rf{stroke:var(--ink)}
.sch .e.dig{stroke:var(--ink);stroke-dasharray:6 3;stroke-width:1.2}
.sch .e.ctl{stroke:var(--ctl);stroke-dasharray:2 3;stroke-width:1.2}
.sch .e.pwr{stroke:var(--pwr);stroke-dasharray:1 3;stroke-width:2.2;stroke-linecap:round}
.sch .e.lo{stroke:var(--lo);stroke-dasharray:9 3 2 3}
.sch .e.bus{stroke:var(--copper);stroke-width:1.8}
.sch .el{font-family:var(--mono);font-size:9px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.sch.focus .e:not(.on){opacity:.18}
.sch .e.on{stroke-width:2.4}
.sch .e.on.rf,.sch .e.on.dig{stroke:var(--copper)}
.dfoot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;border-top:1px solid var(--line);padding:12px 16px;align-items:start}
@media (max-width:860px){.dfoot{grid-template-columns:1fr}}
.ddesc{min-height:48px}
.ddesc h3{margin:0 0 2px;font-family:var(--display);font-stretch:78%;font-size:18px;text-transform:uppercase}
.ddesc p{margin:0;max-width:80ch;font-size:14px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);max-width:520px;justify-content:flex-end}
@media (max-width:860px){.leg{justify-content:flex-start}}
.leg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.leg svg{overflow:visible}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:0}
.how article{padding:16px 18px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.how h3{margin:0 0 8px;font-family:var(--display);font-stretch:78%;font-size:19px;text-transform:uppercase;line-height:1.15}
.how p{margin:0 0 10px;max-width:72ch}
.how p:last-child{margin-bottom:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk)}
td.b{font-weight:700}
td.m{color:var(--muted)}
td.n{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.atbl{min-width:760px}
.chal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.chal div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.chal b{display:block;font-family:var(--display);font-stretch:80%;font-size:16px;text-transform:uppercase;margin-bottom:4px;color:var(--copper)}
.chal p{margin:0;font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px}
@media (max-width:960px){.two{grid-template-columns:1fr}}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn a{display:block;border:1px solid var(--line);background:var(--surface);padding:12px 16px;text-decoration:none;color:var(--ink)}
.pn a:hover{border-color:var(--copper)}
.pn a span{display:block}
.pn .nx{text-align:right}
.pn b{font-family:var(--display);font-stretch:75%;font-size:20px;text-transform:uppercase}
.modnav{display:grid;gap:6px}
.modnav .ng{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.modnav .ng .label{min-width:92px}
header.hdr.nocost{grid-template-columns:1fr}
.sch .lk{font-size:11px;fill:var(--copper);font-weight:700}
.go{display:inline-block;margin-top:8px;font-weight:650;color:var(--copper);text-decoration:none;border-bottom:1.5px solid var(--copper)}
.go:hover{border-bottom-width:3px}
.eqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.eqc{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:6px;align-content:start;min-width:0}
.eqc .f{font-family:var(--mono);font-size:14.5px;font-weight:600;background:var(--sunk);padding:8px 10px;border-left:3px solid var(--copper);overflow-x:auto;white-space:pre-wrap}
.eqc p{margin:0;font-size:14px;color:var(--muted)}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.rel a{padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rel a:hover{background:var(--sunk)}
.rel b{display:block;font-family:var(--display);font-stretch:78%;font-size:18px;text-transform:uppercase}
/* software layer stack */
.swk{display:grid;gap:0}
.swr{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,330px);border-bottom:1px solid var(--line)}
.swr:last-child{border-bottom:0}
@media (max-width:860px){.swr{grid-template-columns:1fr}}
.swl{padding:12px 14px;color:var(--surface);background:var(--lc);display:flex;flex-direction:column;gap:2px;justify-content:center}
.swl b{font-family:var(--display);font-stretch:80%;font-size:15px;text-transform:uppercase;line-height:1.1}
.swl span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.swm{padding:12px 16px;min-width:0;border-left:4px solid var(--lc)}
.swm h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
.swm p{margin:0;font-size:14px;max-width:70ch}
.swx{padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;align-content:center;background:color-mix(in oklab,var(--lc) 7%,var(--surface));min-width:0}
.swx dt{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.swx dd{margin:0}
.swhw{padding:10px 14px;background:var(--sunk);font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;border-top:2px solid var(--ink)}
.swfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.swleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.swleg i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;background:var(--lc)}
/* shared study widgets */
.calc{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:0}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.cin{padding:16px;border-right:1px solid var(--line);display:grid;gap:12px;align-content:start;min-width:0}
@media (max-width:900px){.cin{border-right:0;border-bottom:1px solid var(--line)}}
.cin fieldset{border:1px solid var(--line);padding:10px 12px;display:grid;gap:8px;margin:0;min-width:0}
.cin legend{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.cin label{display:grid;gap:3px;font-size:13px}
.cin label.row{display:flex;gap:6px;align-items:center}
.cin select,.cin input[type=number]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;min-width:0}
.cin input[type=range]{width:100%;accent-color:var(--copper)}
.cin output{font-family:var(--mono);font-size:13px;font-weight:600}
.cout{padding:16px;display:grid;gap:14px;min-width:0;align-content:start}
.lvl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line)}
.lvl div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.lvl b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.lvl b.bad{color:var(--copper)}
.lvl b.ok{color:var(--ok)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.theory{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
@media (max-width:900px){.theory{grid-template-columns:1fr}}
.theory>div{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.theory>div:last-child{border-right:0}
.theory h3{margin:0 0 8px;font-family:var(--display);font-stretch:78%;font-size:19px;text-transform:uppercase}
.theory p{margin:0 0 10px;max-width:68ch}
table.ed td{padding:4px 6px}
table.ed input{font:inherit;font-family:var(--mono);font-size:12.5px;width:100%;min-width:56px;padding:4px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px}
table.ed input.nm{font-family:var(--body);min-width:150px}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn2{font:500 12.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.btn2:hover{border-color:var(--copper)}
.btn2[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.note2{font-size:13px;color:var(--muted);margin:0;max-width:80ch}
.kv{font-family:var(--mono);font-size:12.5px}
footer{font-size:12.5px;color:var(--muted);max-width:90ch}
a:focus-visible,.b:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
</style>

table.sm tbody th b{display:block;font-family:var(--display);font-stretch:80%;font-size:14px;text-transform:uppercase;line-height:1.1}
table.sm tbody th span{font-family:var(--mono);font-size:9.5px;opacity:.9}
table.sm td button{all:unset;box-sizing:border-box;display:block;width:100%;min-height:58px;padding:7px 8px;cursor:pointer;font-family:var(--body);font-size:12px;line-height:1.3;color:var(--ink);background:color-mix(in oklab,var(--lc) 7%,var(--surface));position:relative}
table.sm td button:hover{background:color-mix(in oklab,var(--lc) 18%,var(--surface))}
table.sm td button:focus-visible{outline:2px solid var(--copper);outline-offset:-2px}
table.sm td.empty{background:repeating-linear-gradient(45deg,var(--surface) 0 5px,var(--sunk) 5px 7px)}
table.sm td.sel button{box-shadow:inset 0 0 0 3px var(--copper)}
table.sm.trace td:not(.on) button{opacity:.32}
table.sm.trace td.empty{opacity:.4}
table.sm td.on button{background:color-mix(in oklab,var(--lc) 26%,var(--surface));box-shadow:inset 0 0 0 2px var(--lc)}
.badge{position:absolute;top:4px;right:4px;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.badge i{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;background:var(--copper);color:var(--surface);border-radius:999px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 4px}
.smd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
@media (max-width:900px){.smd{grid-template-columns:1fr}}
.smd>div{padding:14px 16px;min-width:0}
.smd>div+div{border-left:1px solid var(--line)}
@media (max-width:900px){.smd>div+div{border-left:0;border-top:1px solid var(--line)}}
.smd h3{margin:2px 0 6px;font-family:var(--display);font-stretch:78%;font-size:21px;text-transform:uppercase;line-height:1.1}
.smd p{margin:0 0 8px;max-width:70ch}
.steps{margin:0;padding-left:0;list-style:none;display:grid;gap:6px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.steps li::before{counter-increment:st;content:counter(st);font-family:var(--mono);font-weight:700;font-size:11px;background:var(--copper);color:var(--surface);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.steps li span.lay{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block}
.steps li button{all:unset;cursor:pointer;color:var(--ink);border-bottom:1px dotted var(--muted)}

const IOS=[["Apps","Kotlin/Java on ART, or native code via NDK","Swift or Objective-C with SwiftUI/UIKit"],["OS framework","system_server services, Binder IPC; Mainline modules updated via Google Play","Frameworks (Foundation, Core Telephony, Core Location, AVFoundation, Core ML) and system daemons such as CommCenter for telephony and locationd"],["HAL & vendor services","AIDL HALs in a separate vendor partition (Project Treble), written by SoC vendors and phone makers","No separate vendor layer; Apple writes the drivers and daemons for its own hardware"],["Kernel & drivers","Linux (Generic Kernel Image) plus vendor kernel modules","XNU kernel with IOKit drivers; some drivers in user space via DriverKit"],["Secure world","TrustZone trusted OS (QTEE, Trusty, Kinibi, OP-TEE); optional StrongBox chip","Secure Enclave: a separate processor running Apple's sepOS"],["Co-processor firmware","Modem, DSP, ISP, Wi-Fi/BT, GNSS and power-controller firmware from the chip vendors","Same categories: baseband firmware (Qualcomm or Apple's own modem), Neural Engine, ISP and always-on processor firmware"],["Boot & ROM","Boot ROM → vendor bootloaders → Android Verified Boot","Boot ROM → iBoot → kernel; the Secure Enclave has its own boot ROM"],["Updates","Apps via store; Mainline modules monthly; everything else in the maker's OTA","Apps via App Store; everything else in iOS updates, plus background security fixes between releases"]];

how:[
 ["Why so many layers",["Each layer exists so the layer above can change without the one below changing. Apps never touch drivers; the OS talks to hardware only through stable HAL interfaces; drivers talk to chips through register maps or host-controller protocols; firmware hides the chip's internal timing.","Android's Project Treble made this split formal: the vendor partition holds everything the SoC vendor and phone maker supply, so a new Android version can boot on old vendor code."]],
 ["Many processors, many operating systems",["Only the main CPU runs Android. The modem runs a real-time OS with the cellular stack. DSPs run their own RTOS for audio, sensors and AI. The Wi-Fi chip, camera ISP, GPU, power controller, NFC controller, UWB chip, fuel gauge and secure element each run firmware.","These processors talk to Android through shared memory, mailboxes and standard protocols such as Bluetooth HCI, NFC NCI and UWB UCI."]],
 ["Real time versus best effort",["Android schedules threads with millisecond-level latency, fine for apps but not for radio. A 5G slot can be 125 µs long, and the modem must acknowledge data within a few slots, so everything with hard deadlines runs in firmware on dedicated processors with hardware timers.","That is why the RF parts are controlled by modem firmware, not by Linux drivers."]],
 ["Trust and isolation",["A chain of signatures starts in the boot ROM and covers every bootloader, the kernel, the system partitions and every firmware image. The secure world and secure elements hold keys that even a fully compromised Android kernel cannot read.","Hardware firewalls also isolate the modem from the application processor, so a bug in one cannot directly read the other's memory."]]
],

document.getElementById("leg").innerHTML=usedL.map(k=>{const m={app:"Apps",fw:"OS framework",hal:"HAL & vendor services",kern:"Kernel & drivers",sec:"Secure world",co:"Co-processor firmware",boot:"Boot, ROM & config"};return `<span><svg width="20" height="12"><rect x="0.5" y="0.5" width="19" height="11" fill="color-mix(in oklab,var(--L-${k}) 12%,var(--surface))" stroke="var(--L-${k})" stroke-width="1.4"/></svg>${m[k]}</span>`}).join("")+[...usedE].map(t=>`<span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" class="e ${t}" style="stroke:${t==="ctl"?"var(--ctl)":t==="pwr"?"var(--pwr)":t==="lo"?"var(--lo)":t==="bus"?"var(--copper)":"var(--ink)"};stroke-dasharray:${t==="dig"?"6 3":t==="ctl"?"2 3":t==="pwr"?"1 3":t==="lo"?"9 3 2 3":"0"};stroke-width:${t==="pwr"?2.2:1.6};stroke-linecap:round"/></svg>${EN[t]}</span>`).join("")
 +`<span><svg width="20" height="12"><rect x="0.5" y="0.5" width="19" height="11" fill="var(--sunk)" stroke="var(--wire)" stroke-dasharray="3 2"/></svg>Outside the module</span>`
 +[...new Map([...usedSym].map(k=>[SN[k],k])).values()].map(k=>`<span><svg viewBox="-1 -1 20 20" width="15" height="15" class="gy" style="fill:none;stroke:var(--ink);stroke-width:1.2">${G[k]}</svg>${SN[k]}</span>`).join("");

document.querySelectorAll("#leg svg").forEach(s=>s.querySelectorAll("path,rect,circle").forEach(n=>{if(!n.getAttribute("fill"))n.setAttribute("fill","none")}));
