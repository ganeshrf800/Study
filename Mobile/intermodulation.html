}

*{box-sizing:border-box}

.scroll{overflow-x:auto}
svg.sch{display:block;height:auto;min-width:760px;width:100%}
.sch text{font-family:var(--body);fill:var(--ink)}
.sch .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;fill:var(--muted)}
.sch .grp{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:6 4}
.sch .grpf{fill:color-mix(in oklab,var(--sunk) 35%,var(--surface))}
.sch .b rect.box{fill:var(--surface);stroke:var(--ink);stroke-width:1.1;transition:stroke-width .12s}
.sch .b.ext rect.box{fill:var(--sunk);stroke:var(--wire);stroke-dasharray:4 3}

.sch .b.hl rect.box{stroke:var(--copper);stroke-width:1.6}

.sch .b:hover rect.box,.sch .b.on rect.box{stroke:var(--copper);stroke-width:2.2}
.sch .bt{font-size:11.2px;font-weight:600;font-stretch:90%}

.sch .e.rf{stroke:var(--ink)}

.sch .e.ctl{stroke:var(--ctl);stroke-dasharray:2 3;stroke-width:1.2}
.sch .e.pwr{stroke:var(--pwr);stroke-dasharray:1 3;stroke-width:2.2;stroke-linecap:round}
.sch .e.lo{stroke:var(--lo);stroke-dasharray:9 3 2 3}
.sch .e.bus{stroke:var(--copper);stroke-width:1.8}
.sch .el{font-family:var(--mono);font-size:9px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.sch.focus .e:not(.on){opacity:.18}

.sch .e.on.rf,.sch .e.on.dig{stroke:var(--copper)}
.dfoot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;border-top:1px solid var(--line);padding:12px 16px;align-items:start}

.lvl div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}

.chart{width:100%;height:auto;display:block}

.theory{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}

table.ed input{font:inherit;font-family:var(--mono);font-size:12.5px;width:100%;min-width:56px;padding:4px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px}
table.ed input.nm{font-family:var(--body);min-width:150px}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn2{font:500 12.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}

.note2{font-size:13px;color:var(--muted);margin:0;max-width:80ch}
.kv{font-family:var(--mono);font-size:12.5px}
footer{font-size:12.5px;color:var(--muted);max-width:90ch}
a:focus-visible,.b:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
</style>

{id:"theory",title:"Where intermodulation comes from",toc:"Theory",
html:`<div class="theory"><div>
<h3 style="margin:0 0 8px;font-family:var(--display);font-stretch:78%;font-size:19px;text-transform:uppercase">The power series</h3>
<p>Any slightly nonlinear device can be written as y = a1·x + a2·x² + a3·x³ + a4·x⁴ + a5·x⁵ + … Feed it two tones at f1 and f2 and the x² term produces 2f1, 2f2, f1+f2 and f2−f1. The x³ term produces 3f1, 3f2, 2f1±f2 and 2f2±f1. Higher terms add 4th- and 5th-order mixes in the same pattern: every product is m·f1 ± n·f2 with order m+n.</p>
<p>Product power grows with the order: an IM2 product rises 2 dB for every 1 dB rise in both tones, IM3 rises 3 dB. The intercept point is where the extrapolated fundamental and product lines would meet; it is a single number that describes a device's linearity.</p>
<p>A product's bandwidth is m·BW1 + n·BW2. A 3rd-order product of two 20 MHz carriers is 60 MHz wide, which is why IMD often overlaps a receive band even when the centres miss.</p>
</div><div>
<h3 style="margin:0 0 8px;font-family:var(--display);font-stretch:78%;font-size:19px;text-transform:uppercase">Sources inside a phone</h3>
<p><b>Antenna switches and tuners</b> see both transmit signals at full power and sit after all filtering, so their products go straight to the antenna and into the receive path. This is why switch linearity specs are so demanding.</p>
<p><b>Duplexers and multiplexers</b> generate passive IMD in their acoustic resonators at high power. <b>PAs</b> generate products when the other transmitter's signal couples back into their output (reverse IMD). <b>Receivers</b> generate IM2 from their own TX leakage in zero-IF mixers.</p>
<p><b>Mitigations</b> include frequency planning, higher-linearity switches, more antenna isolation between the two transmitters, single-uplink (time-multiplexed) operation for problem combinations, transmit power back-off, and digital cancellation of known products in the modem.</p>
</div></div>`}

 B20:["B20 / n20",[832,862],[791,821],"FDD"],B28:["B28 / n28",[703,748],[758,803],"FDD"],B30:["B30",[2305,2315],[2350,2360],"FDD"],

 n41:["n41",[2496,2690],[2496,2690],"TDD"],n77:["n77",[3300,4200],[3300,4200],"TDD"],n78:["n78",[3300,3800],[3300,3800],"TDD"],n79:["n79",[4400,5000],[4400,5000],"TDD"],B40:["B40 / n40",[2300,2400],[2300,2400],"TDD"]
};

// victims: [key, short label, range, own-band key]
const VIC=[
 ["v71","B71 DL",[617,652],"B71"],["v12","B12 DL",[729,746],"B12"],["v13","B13 DL",[746,756],"B13"],["v14","B14 DL",[758,768],"B14"],
 ["v28","B28 DL",[758,803],"B28"],["v20","B20 DL",[791,821],"B20"],["v5","B5 DL",[869,894],"B5"],["v8","B8 DL",[925,960],"B8"],
 ["vL5","GNSS L5",[1164,1189],null],["v32","B32 SDL",[1452,1496],null],["vL1","GNSS L1",[1559,1610],null],["v3","B3 DL",[1805,1880],"B3"],
 ["v2","B2/25 DL",[1930,1995],"B2"],["v1","B1/66 DL",[2110,2200],"B1|B66"],["v30","B30 DL",[2350,2360],"B30"],["v40","B40",[2300,2400],"B40"],
 ["vW2","Wi-Fi 2.4/BT",[2400,2483.5],null],["v7","B7 DL",[2620,2690],"B7"],["v41","n41",[2496,2690],"n41"],["v78","n78",[3300,3800],"n78"],["v77","n77",[3300,4200],"n77"],
 ["v79","n79",[4400,5000],"n79"],["vW5","Wi-Fi 5 GHz",[5150,5895],null],["vW6","Wi-Fi 6 GHz",[5925,7125],null],["vU","UWB ch5/9",[6240,8237],null]
];
// aggressor pairs: [A, B, region, note]
const AGG=[
 ["B2","n71","US","EN-DC"],["B66","n71","US","EN-DC"],["B2","n41","US","EN-DC"],["B66","n41","US","EN-DC"],["B12","n41","US","EN-DC"],
 ["B2","n5","US","EN-DC"],["B66","n5","US","EN-DC"],["B2","n77","US","EN-DC"],["B66","n77","US","EN-DC"],["B5","n77","US","EN-DC"],
 ["B13","n77","US","EN-DC"],["B14","n77","US","EN-DC"],["B30","n77","US","EN-DC"],["B12","n66","US","EN-DC"],["B2","B66","US","UL CA"],
 ["B3","n78","EU","EN-DC"],["B1","n78","EU","EN-DC"],["B7","n78","EU","EN-DC"],["B8","n78","EU","EN-DC"],["B20","n78","EU","EN-DC"],
 ["B3","n28","EU","EN-DC"],["B1","n28","EU","EN-DC"],["B3","B7","EU","UL CA"],["B3","B20","EU","UL CA"],["B7","B20","EU","UL CA"],["B1","B3","EU","UL CA"],
 ["B1","n79","Asia","EN-DC"],["B3","n79","Asia","EN-DC"],["B28","n78","Asia","EN-DC"],["B1","n77","Asia","EN-DC"],["B3","n41","Asia","EN-DC"],["B40","n78","Asia","EN-DC"]
];
const UL=id=>BAND[K(id)][1];
function absIv(lo,hi){if(lo>=0)return[lo,hi];if(hi<=0)return[-hi,-lo];return[0,Math.max(-lo,hi)]}
function products(A,B,maxO,harm){
 const a=UL(A),b=UL(B),out=[];
 if(harm){[[A,a],[B,b]].forEach(([n,r])=>{[2,3].forEach(k=>{if(k<=maxO)out.push({lab:"H"+k+" "+n,ord:k,src:n,f:`${k}·f(${n})`,iv:[k*r[0],k*r[1]]})})})}
 for(let o=2;o<=maxO;o++)for(let m=1;m<o;m++){const n=o-m;
  out.push({lab:`IM${o}`,ord:o,f:`${m>1?m:""}f(${A}) + ${n>1?n:""}f(${B})`,iv:[m*a[0]+n*b[0],m*a[1]+n*b[1]]});
  const d=absIv(m*a[0]-n*b[1],m*a[1]-n*b[0]);
  out.push({lab:`IM${o}`,ord:o,f:`|${m>1?m:""}f(${A}) − ${n>1?n:""}f(${B})|`,iv:d});
 }
 return out;
}
const ov=(x,y)=>Math.max(x[0],y[0])<Math.min(x[1],y[1]);
const tddBusy=(A,B,v)=>[A,B].some(id=>BAND[K(id)][3]==="TDD"&&ov(BAND[K(id)][1],v[2]));
const isTdd=id=>BAND[K(id)][3]==="TDD";
function hitsFor(A,B,v,maxO,harm){
 const busy=tddBusy(A,B,v);
 let P=products(A,B,maxO,harm);
 if(busy){const quiet=[A,B].filter(id=>!(isTdd(id)&&ov(BAND[K(id)][1],v[2])));P=P.filter(p=>p.src&&quiet.includes(p.src))}
 return {busy,hits:P.filter(p=>ov(p.iv,v[2]))};
}
const own=(A,B,v)=>v[3]&&v[3].split("|").some(o=>o===K(A)||o===K(B)||o===A||o===B);
let region="All",sel=null;
const reg=document.getElementById("mxRegion");
["All","US","EU","Asia"].forEach(r=>{const b=document.createElement("button");b.textContent=r;b.setAttribute("aria-pressed",String(r===region));b.onclick=()=>{region=r;[...reg.querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed",String(x.textContent===r)));draw()};reg.appendChild(b)});

function draw(){
 const maxO=+document.getElementById("mxOrder").value,harm=document.getElementById("mxH").checked,onlyOwn=document.getElementById("mxOwn").checked;
 const rows=AGG.filter(a=>region==="All"||a[2]===region);
 let h=`<thead><tr><th class="corner"><span class="label" style="writing-mode:horizontal-tb;transform:none">Uplink pair ↓ · Victim RX →</span></th>${VIC.map(v=>`<th scope="col" title="${esc(v[1])}: ${v[2][0]}–${v[2][1]} MHz"><span>${esc(v[1])}</span></th>`).join("")}</tr></thead><tbody>`;
 rows.forEach((a,ri)=>{
  const P=products(a[0],a[1],maxO,harm);
  h+=`<tr><th scope="row">${esc(a[0])} + ${esc(a[1])}<small>${a[2]} · ${a[3]}</small></th>`;
  VIC.forEach((v,vi)=>{
   const isOwn=own(a[0],a[1],v);
   if(onlyOwn&&!isOwn){h+=`<td class="na" aria-label="hidden"></td>`;return}
   const R=hitsFor(a[0],a[1],v,maxO,harm),hits=R.hits;
   if(R.busy&&!hits.length){h+=`<td class="na" title="This TDD band is one of the transmitters; it cannot receive while transmitting, and the other carrier harmonics miss it"></td>`;return}
   const mo=hits.length?Math.min(...hits.map(p=>p.ord)):0;
   const top=hits.find(p=>p.ord===mo);
   const t=mo?(top.lab.startsWith("H")?"H"+mo:"IM"+mo):"";
   h+=`<td tabindex="0" data-r="${AGG.indexOf(a)}" data-v="${vi}" class="${mo?"o"+mo:""}${isOwn?" own":""}${R.busy?" tdd":""}${sel&&sel[0]===AGG.indexOf(a)&&sel[1]===vi?" sel":""}" aria-label="${esc(a[0]+" + "+a[1]+" into "+v[1]+": "+(t||"no product"))}">${t}</td>`;
  });

 });
 mx.innerHTML=h+"</tbody>";
 if(sel)detail(sel[0],sel[1]);else mxd.innerHTML=`<span class="label">Cell detail</span><p style="margin:0">Select a coloured cell to see every product that can land in that receiver, with its formula and frequency span.</p>`;
}
function detail(ri,vi){

 const ua=UL(a[0]),ub=UL(a[1]);
 mxd.innerHTML=`<span class="label">${esc(a[2])} · ${esc(a[3])}</span><h3>${esc(a[0])} (UL ${ua[0]}–${ua[1]}) + ${esc(a[1])} (UL ${ub[0]}–${ub[1]}) → ${esc(v[1])} (${v[2][0]}–${v[2][1]} MHz)</h3>`+
 (hits.length?`<div class="tw"><table><thead><tr><th>Product</th><th>Order</th><th>Formula</th><th>Possible span (MHz)</th><th>Overlap with victim</th></tr></thead><tbody>${hits.map(p=>`<tr><td class="b">${esc(p.lab)}</td><td class="n">${p.ord}</td><td class="n">${esc(p.f)}</td><td class="n">${Math.round(p.iv[0])}–${Math.round(p.iv[1])}</td><td class="n">${Math.round(Math.max(p.iv[0],v[2][0]))}–${Math.round(Math.min(p.iv[1],v[2][1]))}</td></tr>`).join("")}</tbody></table></div><p style="margin:0;font-size:13px;color:var(--muted)">Spans assume any channel in each uplink band. Use the calculator below with specific channels to see whether a real allocation hits.${R.busy?" This receiver is the TDD band that is also transmitting, so only harmonics of the other carrier can hit it, during the TDD band receive slots.":""}${own(a[0],a[1],v)?" This victim is one of the aggressors' own downlinks, the case 3GPP covers with MSD allowances.":""}</p>`:`<p style="margin:0">No product up to the selected order lands in this receiver.</p>`);
}

 const ra=BAND[A][1],rb=BAND[B][1];
 const ca=Math.min(Math.max(a,ra[0]+wa/2),ra[1]-wa/2),cb=Math.min(Math.max(b,rb[0]+wb/2),rb[1]-wb/2);
 document.getElementById("oA").textContent=ca.toFixed(1)+" MHz";document.getElementById("oB").textContent=cb.toFixed(1)+" MHz";
 const P=[];
 if(harm){[[A,ca,wa],[B,cb,wb]].forEach(([n,f,w])=>[2,3].forEach(k=>P.push({lab:`H${k} ${n}`,ord:k,src:n,f:`${k}·${f.toFixed(1)}`,c:k*f,w:k*w})))}

 document.getElementById("ptb").innerHTML=P.filter(p=>p.c>1).sort((x,y)=>x.c-y.c).map(p=>`<tr><td class="b">${esc(p.lab)}</td><td class="n">${p.ord}</td><td class="n">${esc(p.f)}</td><td class="n">${p.iv[0].toFixed(1)}–${p.iv[1].toFixed(1)}</td><td class="${p.hits.length?"hit":"m"}">${p.hits.length?esc(p.hits.join(", ")):"—"}</td></tr>`).join("");
 // spectrum

 let lastX=[-99,-99];VIC.forEach((v,i)=>{const x0=lx(Math.max(v[2][0],f0)),x1=lx(Math.min(v[2][1],f1)),cx=(x0+x1)/2,lab=v[1].replace(" DL","").replace("Wi-Fi ","Wi-Fi\u00a0");const w=lab.length*6.1;let row=cx-w/2>lastX[0]+4?0:(cx-w/2>lastX[1]+4?1:-1);if(row<0)return;lastX[row]=cx+w/2;s+=`<text x="${cx}" y="${row?22:11}" text-anchor="middle">${esc(lab)}</text>`});
 const hgt={1:122,2:98,3:76,4:56,5:40};

function wrapT(s,max){const w=s.split(" ");const L=[];let c="";w.forEach(t=>{if(c&&(c+" "+t).length>max){L.push(c);c=t}else c=c?c+" "+t:t});if(c)L.push(c);return L}
const usedSym=new Set(),usedE=new Set(edges.map(e=>e.t));
Object.values(B).forEach(o=>{
 const g=el("g",{class:"b "+o.cls,tabindex:"0",role:"button","aria-label":o.label},bG);
 el("rect",{x:o.x,y:o.y,width:o.w,height:o.h,rx:3,class:"box"},g);
 const gw=o.sym?30:0;
 if(o.sym){usedSym.add(o.sym);const s=el("g",{class:"gy",transform:`translate(${o.x+7} ${o.y+o.h/2-9})`},g);s.innerHTML=G[o.sym];
  el("line",{x1:o.x+gw,x2:o.x+gw,y1:o.y+5,y2:o.y+o.h-5,class:"sep"},g)}
 const avail=o.w-gw-14,lines=wrapT(o.label,Math.max(8,Math.floor(avail/6.1)));
 const n=lines.length+(o.sub?1:0),lh=13,cy=o.y+o.h/2-(n-1)*lh/2+4;
 const tx=o.sym?o.x+gw+8:o.x+o.w/2,anc=o.sym?"start":"middle";
 lines.forEach((ln,k)=>{const t=el("text",{x:tx,y:cy+k*lh,"text-anchor":anc,class:"bt"},g);t.textContent=ln});
 if(o.sub){const t=el("text",{x:tx,y:cy+lines.length*lh,"text-anchor":anc,class:"bs"},g);t.textContent=o.sub}
 o.href=linkFor(o);
 if(o.href){const t=el("text",{x:o.x+o.w-5,y:o.y+12,"text-anchor":"end",class:"lk"},g);t.textContent="↗"}
 const act=()=>focus(o.id);
 g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}});
 g.addEventListener("mouseenter",()=>hi(o.id));g.addEventListener("mouseleave",()=>hi(cur));
 o.g=g;
});
let cur=null;
function hi(id){
 svg.classList.toggle("focus",!!id);
 edges.forEach(e=>{const on=!!id&&(e.a===id||e.b===id);e.p.classList.toggle("on",on);
  if(e.t!=="bus")e.p.setAttribute("marker-end",`url(#m-${on&&(e.t==="rf"||e.t==="dig")?"on":e.t})`)});
 Object.values(B).forEach(o=>o.g.classList.toggle("on",o.id===id));
}
const dd=document.getElementById("ddesc");
function focus(id){
 cur=cur===id?null:id;hi(cur);
 if(!cur){dd.innerHTML=`<span class="label">Reading the diagram</span><p>${esc(D.intro)}</p>`;return}
 const o=B[cur],txt=(D.desc||{})[cur]||"";
 const ins=edges.filter(e=>e.b===cur).map(e=>B[e.a].label),outs=edges.filter(e=>e.a===cur).map(e=>B[e.b].label);
 dd.innerHTML=`<span class="label">${o.cls.includes("ext")?"Outside this module":"Block"}</span><h3>${esc(o.label)}</h3><p>${esc(txt)}</p>${ins.length||outs.length?`<p class="label" style="margin-top:6px">${ins.length?"From: "+ins.map(esc).join(", "):""}${ins.length&&outs.length?" · ":""}${outs.length?"To: "+outs.map(esc).join(", "):""}</p>`:""}${o.href?`<a class="go" href="${o.href}">Open the ${esc((PAGES.find(p=>p.file===o.href)||{short:"detail"}).short)} page →</a>`:""}`;
}
focus(null);
document.getElementById("leg").innerHTML=[...usedE].map(t=>`<span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" class="e ${t}" style="stroke:${t==="ctl"?"var(--ctl)":t==="pwr"?"var(--pwr)":t==="lo"?"var(--lo)":t==="bus"?"var(--copper)":"var(--ink)"};stroke-dasharray:${t==="dig"?"6 3":t==="ctl"?"2 3":t==="pwr"?"1 3":t==="lo"?"9 3 2 3":"0"};stroke-width:${t==="pwr"?2.2:1.6};stroke-linecap:round"/></svg>${EN[t]}</span>`).join("")
 +`<span><svg width="20" height="12"><rect x="0.5" y="0.5" width="19" height="11" fill="var(--sunk)" stroke="var(--wire)" stroke-dasharray="3 2"/></svg>Outside the module</span>`
 +[...new Map([...usedSym].map(k=>[SN[k],k])).values()].map(k=>`<span><svg viewBox="-1 -1 20 20" width="15" height="15" class="gy" style="fill:none;stroke:var(--ink);stroke-width:1.2">${G[k]}</svg>${SN[k]}</span>`).join("");
// also style legend svgs (they are outside .sch)
document.querySelectorAll("#leg svg").forEach(s=>s.querySelectorAll("path,rect,circle").forEach(n=>{if(!n.getAttribute("fill"))n.setAttribute("fill","none")}));
})();
</script>
